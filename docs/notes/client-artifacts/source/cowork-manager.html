  const maxC = p ? r2(Math.min(bal, p.subtotal)) : 0;
  const inp = f.creditsToUse;
  if (!f.dataset.touched || Number(inp.value) > maxC) inp.value = Math.floor(maxC) === maxC ? maxC : maxC.toFixed(2);
  inp.max = maxC;
  const credits = f.useCredits.checked && tid ? r2(Math.max(0, Math.min(Number(inp.value) || 0, maxC))) : 0;

function bkCalc(f) {

    ${p.deposit ? `<tr><td>Refundable deposit (no GST, not payable by credits)</td><td class="num">${money(p.deposit)}</td></tr>` : ""}
    <tr><td><b>${cash + p.deposit > 0 ? (f.method.value === "account" ? "Invoiced, pay later" : f.method.value === "nextcycle" ? (tid && tenantHasLease(tid) ? "Added to the tenant's next monthly invoice" : "Next monthly invoice is only for tenants with a lease") : `Collect now by ${m}`) : "Nothing to pay: fully covered by credits"}</b></td><td class="num"><b>${money(cash + gst + p.deposit)}</b></td></tr></tbody></table>

  const unpaid = bkInvoiceIds(b).map(id => S.invoices.find(i => i.id === id)).filter(i => i && i.status !== "void" && i.total > 0.005 && allocatedTo(i.id) <= 0.005);
  const unpaidInv = unpaid.length > 0; const nums = unpaid.map(i => i.number).join(", ");
  const usedCr = r2(bkDraws(b).reduce((s, d) => s + d.amount, 0));
  const parts = [];
  if (!p.eligible) { parts.push("No refund."); if (usedCr) parts.push(`${cr(usedCr)} stay used.`); if (unpaidInv) parts.push(`${nums} stay${unpaid.length > 1 ? "" : "s"} payable.`); }
  else {
    if (unpaidInv) parts.push(`${nums} will be voided.`);
    if (p.dest === "source") parts.push(`${cr(p.credits)} go back to the wallets they came from.`);
    if (p.dest === "refund" && dest === "credits") parts.push(`${cr(r2(p.credits + Math.round(p.cash)))} issued as Refund credits (credits used plus ${money(p.cash)} cash, 1:1), valid until ${fmtD(addDays(addMonths(b.date, S.settings.refundCreditMonths), -1))}.`);
    if (p.dest === "refund" && dest === "card") parts.push(`${money(p.cash)} refunded to card or bank${p.credits ? `, and ${cr(p.credits)} go back to their wallets` : ""}.`);
    if (p.dest === "none" && !unpaidInv) parts.push("Nothing was paid, so there's nothing to refund.");
  }
  const unbilled = (b.chargeIds || []).map(id => S.charges.find(c => c.id === id)).filter(c => c && !c.void && !c.invoiceId);
  const billedUnpaid = (b.chargeIds || []).map(id => S.charges.find(c => c.id === id)).filter(c => c && !c.void && c.invoiceId && invStatus(S.invoices.find(i => i.id === c.invoiceId) || {}) !== "paid");
  if (p.eligible && unbilled.length) parts.push(`${money(unbilled.reduce((s, c) => s + chargeTotal(c), 0))} is removed from the next monthly invoice.`);
  if (p.eligible && billedUnpaid.length) parts.push(`A credit of ${money(billedUnpaid.reduce((s, c) => s + chargeTotal(c), 0))} goes on the next monthly invoice.`);
  if (!p.eligible && unbilled.length) parts.push(`${money(unbilled.reduce((s, c) => s + chargeTotal(c), 0))} stays on the next monthly invoice.`);
  if (b.depositStatus === "held") parts.push(`The ${money(b.deposit)} deposit is still held: return it from the booking.`);
  return parts.join(" ");
}

/* ----- sample data ----- */
async function addSampleData() {
  const ts = S.tenants.filter(t => tenantStatus(t) === "current").slice(0, 5);
  const rs = activeResources(); if (!rs.length || !ts.length) { toast("Add rooms and tenants first."); return; }
  for (const [i, t] of ts.slice(0, 3).entries()) await addWallet(t.id, { type: i === 2 ? "topup" : "monthly", name: i === 2 ? "200 credits · 1 month (sample)" : `${fmtM(monthKey(TODAY))} allowance (sample)`, total: [150, 50, 200][i], expiresOn: i === 2 ? addDays(addMonths(TODAY, 1), -1) : monthEnd(monthKey(TODAY)), period: monthKey(TODAY), sample: true }, { kind: i === 2 ? "purchase" : "monthly", sample: true });
  const mr = rs.filter(r => r.kind === "meeting"), ev = rs.find(r => r.kind === "event");
  const plan = [[0, 0, 10, 2, true, "card"], [1, 1, 14, 1, true, "card"], [2, 0, 9, 3, true, "card"], [3, 2, 15, 1, false, "account"], [4, 1, 11, 2, true, "cash"], [0, 0, 16, 2, true, "card"], [1, 2, 9, 1, true, "card"]];
  const days = [0, 0, 1, 1, 2, 3, 5];
  for (const [k, [ti, ri, st, du, uc, me]] of plan.entries()) {
    const r = mr[ri % mr.length]; const date = addDays(TODAY, days[k]);
    if (bkConflict(r.id, date, st, st + du)) continue;
    await createBooking({ tenantId: ts[ti % ts.length].id, resourceId: r.id, date, start: st, end: st + du, useCredits: uc, method: me, source: k % 2 ? "app" : "admin", sample: true });
  }

}
function hasSampleData() { return ["bookings","wallets","invoices","leases","tenants"].some(c => S[c].some(d => d.sample || d.sampleOrig)); }
async function removeSampleData() {
  const ops = [];
  const sampleInv = new Set(S.invoices.filter(i => i.sample).map(i => i.id)), sampleT = new Set(S.tenants.filter(t => t.sample).map(t => t.id));
  for (const e of S.emails) if (sampleInv.has(e.invoiceId) || sampleT.has(e.tenantId)) ops.push(() => remove("emails", e.id));
  for (const c of ["bookings", "wallets", "creditTxns", "invoices", "payments", "creditPlans", "agreements", "charges", "tenantNotes"]) for (const d of S[c]) if (d.sample) ops.push(async () => { if (c === "agreements" && d.assetId && S.assets) { try { await S.assets.delete(d.assetId); } catch {} } await remove(c, d.id); });
  for (const l of S.leases) { if (l.sample) ops.push(() => remove("leases", l.id)); else if (l.sampleOrig) ops.push(() => patch("leases", l.id, { ...l.sampleOrig, sampleOrig: null })); }

  await writeMany(ops);
}

/* ----- contacts ----- */
function contactsOf(t) {
  if (!t) return [];
  if (Array.isArray(t.contacts) && t.contacts.length) return t.contacts.filter(c => c && (c.name || c.email || c.phone));
  const name = t.contactPerson || (t.kind === "personal" ? t.name : "");
  return (name || t.email || t.phone) ? [{ name, title: "", email: t.email || "", phone: t.phone || "" }] : [];
}
function contactsCell(t) {
  const cs = contactsOf(t);
  if (!cs.length) return `<span class="muted">—</span>`;
  return cs.map((c, i) => `<div style="${i ? "margin-top:5px" : ""}"><b>${esc(c.name || "—")}</b>${i === 0 ? ` <span class="pill brass" style="font-size:10.5px">Primary</span>` : ""}${c.title ? ` <span class="muted">· ${esc(c.title)}</span>` : ""}<div class="muted">${[c.email, c.phone].filter(Boolean).map(esc).join(" · ")}</div></div>`).join("");
}
const emailsOf = (t, mode = "all") => {
  const cs = contactsOf(t).map(c => c.email).filter(Boolean);
  const list = mode === "primary" ? cs.slice(0, 1) : mode === "billing" ? [t.billingEmail || cs[0]].filter(Boolean) : [...cs, t.billingEmail].filter(Boolean);
  return [...new Set(list.map(e => e.trim().toLowerCase()))];
};
const billToAddress = t => (t && (t.billingAddress || t.address)) || "";

/* ----- users & audit ----- */
let namesPending = false;
function userName(id) {
  if (!id) return "System";
  if (id === S.userId) return "you";
  if (S.names[id] != null) return S.names[id] || "A colleague";
  if (!namesPending && S.user && S.user.profiles) {
    namesPending = true;
    const ids = [...new Set([...S.audit.map(a => a.by), ...S.invoices.map(i => i.voidedBy)].filter(Boolean))];
    S.user.profiles(ids).then(ps => { for (const i of ids) S.names[i] = (ps && ps[i] && ps[i].name) || ""; namesPending = false; schedule(); }).catch(() => { namesPending = false; });
  }
  return "A colleague";
}
async function audit(action, details = {}) {
  try { await put("audit", uid("au"), { action, by: S.userId || null, at: new Date().toISOString(), ...details }); } catch (e) { console.warn("audit", e); }

/* ----- email templates & outbox ----- */
function bankText() {
  const s = S.settings; const rows = [];
  if (s.bankName || s.bankAccountNo) rows.push(`Bank transfer: ${[s.bankName, s.bankAccountName, s.bankAccountNo].filter(Boolean).join(" · ")}`);
  if (s.payNowId) rows.push(`PayNow: ${s.payNowId}`);
  return rows.join("\n");
}
function fillTemplate(text, v) { return String(text || "").replace(/\{(\w+)\}/g, (m, k) => v[k] != null ? v[k] : m); }
const centreName = locId => (locById(locId)?.name) || S.locations[0]?.name || "our centre";
function mailtoFor(e) {
  const q = [];
  if (e.cc && e.cc.length) q.push("cc=" + encodeURIComponent(e.cc.join(",")));
  if (e.bcc && e.bcc.length) q.push("bcc=" + encodeURIComponent(e.bcc.join(",")));
  q.push("subject=" + encodeURIComponent(e.subject || ""), "body=" + encodeURIComponent(e.body || ""));
  return `mailto:${(e.to || []).map(encodeURIComponent).join(",")}?${q.join("&")}`;
}
function reminderStages() { return String(S.settings.reminderDays || "").split(/[,\s]+/).map(Number).filter(n => n > 0).sort((a, b) => a - b); }
async function queueReminders() {
  const stages = reminderStages(); if (!stages.length) return 0;
  let n = 0;
  for (const inv of S.invoices) {
    if (!["rent", "charges", "upfront"].includes(inv.kind) || invStatus(inv) !== "overdue") continue;
    const late = diffDays(inv.dueDate, TODAY); const reached = stages.filter(d => d <= late); if (!reached.length) continue;
    const top = reached[reached.length - 1]; const done = inv.reminders || {}; if (done[top]) continue;
    const t = tenantById(inv.tenantId); if (!t) continue;
    const to = emailsOf(t, "billing"), cc = emailsOf(t, "all").filter(e => !to.includes(e));
    const fee = lateFeeFor(inv);
    const body = `Dear ${contactsOf(t)[0]?.name || t.name},\n\nOur records show that invoice ${inv.number} (${money(inv.total)}, due ${fmtD(inv.dueDate)}) is ${late} days overdue. The outstanding balance is ${money(invBalance(inv))}.\n\n${Number(S.settings.lateFeeRate) ? `Invoices paid more than ${S.settings.graceDays} days after the due date incur a late fee of ${S.settings.lateFeeRate}% per annum on the rental, counted from the due date, plus GST${fee && !fee.waived ? `. As of today it is ${money(fee.total)} incl. GST and it increases daily until payment` : ""}.\n\n` : ""}${bankText() ? `How to pay:\n${bankText()}\nPlease quote ${inv.number} as the reference.\n\n` : ""}If you've already paid, please ignore this message or reply with your payment details.\n\nThank you,\n${S.settings.businessName || centreName(inv.locationId)}`;
    const id = uid("em"); const nth = new Set(Object.values(done)).size + 1;
    await put("emails", id, { kind: "reminder", stage: nth, to, cc, subject: `Payment reminder${nth > 1 ? ` (${nth === 2 ? "2nd" : nth === 3 ? "3rd" : nth + "th"} notice)` : ""}: ${inv.number} is ${late} days overdue`, body, tenantId: t.id, invoiceId: inv.id, status: "queued", auto: true, queuedAt: new Date().toISOString() });
    const marks = { ...done }; reached.forEach(d => { if (!marks[d]) marks[d] = id; });
    await patch("invoices", inv.id, { reminders: marks });
    n++;
  }
  return n;
}
async function queueHouseRules() {
  let n = 0;
  for (const l of S.leases) {
    if (!l.tenantId || !leaseValid(l) || l.houseRulesEmailId || l.start > TODAY || l.start < addDays(TODAY, -3)) continue;
    const t = tenantById(l.tenantId); if (!t) continue;
    const v = { name: contactsOf(t)[0]?.name || t.name, centre: centreName(l.locationId), unit: l.unitCode, business: S.settings.businessName || centreName(l.locationId) };
    const id = uid("em");
    await put("emails", id, { kind: "houseRules", to: emailsOf(t, "all"), cc: [], subject: fillTemplate(S.settings.houseRulesSubject, v), body: fillTemplate(S.settings.houseRulesBody, v), tenantId: t.id, leaseId: l.id, status: "queued", auto: true, queuedAt: new Date().toISOString() });
    await patch("leases", l.id, { houseRulesEmailId: id });

}

}

  return `<div class="section"><h3 style="display:flex;justify-content:space-between;gap:8px;align-items:center">Charges for the next monthly invoice · ${money(cs.reduce((s, c) => s + chargeTotal(c), 0))} <button class="btn small" data-act="chgForm" data-tenant="${tid}" ${W()}>Record charge</button></h3><table><tbody>${cs.map(c => `<tr><td class="small">${esc(c.desc)}<div class="muted">${fmtD((c.createdAt || "").slice(0, 10))}${c.source === "booking" ? " · room booking" : ""}</div></td><td class="num">${money(chargeTotal(c))}</td><td class="right">${c.source === "booking" ? "" : `<button class="btn small" data-act="chargeDel" data-id="${c.id}" ${W()}>Remove</button>`}</td></tr>`).join("")}</tbody></table></div>`;

async function addCharges(tid, lines, meta = {}) {
  const locationId = S.leases.find(l => l.tenantId === tid && leaseOn(l, TODAY))?.locationId || S.locations[0]?.id || "";

  for (const l of lines) { const id = uid("chg"); ids.push(id); await put("charges", id, { tenantId: tid, locationId, desc: l.desc, qty: l.qty || 1, price: l.price, ...(l.noTax ? { noTax: true } : { taxRate: l.taxRate ?? (Number(S.settings.taxRate) || 0) }), invoiceId: null, void: false, createdAt: new Date().toISOString(), ...meta }); }

/* ----- dashboard: outbox & follow-ups ----- */
function dashAttention() {
  const q = S.emails.filter(e => e.status === "queued");
  const fu = S.tenantNotes.filter(n => n.followUp && !n.done && n.followUp <= addDays(TODAY, 7)).sort(by(n => n.followUp));
  const pend = S.charges.filter(c => !c.invoiceId && !c.void);
  if (!q.length && !fu.length && !pend.length) return "";
  return `<div class="grid g3" style="margin-top:16px">
    <div class="panel"><h2>Emails to send</h2><p class="sub">${q.length} in the outbox</p>${q.slice(0, 5).map(e => `<div class="small" style="margin-bottom:6px">${pill(...(EMAIL_K[e.kind] || ["Email", ""]))} ${esc(e.subject)}</div>`).join("") || `<p class="muted small">All sent.</p>`}${q.length ? `<button class="btn small" data-act="nav" data-v="emails">Open outbox</button>` : ""}</div>
    <div class="panel"><h2>Follow-ups</h2><p class="sub">Due within 7 days</p>${fu.slice(0, 6).map(n => `<div class="small click" style="margin-bottom:6px" data-act="tenantNotes" data-id="${n.tenantId}"><b>${esc(tenantName(n.tenantId))}</b> · ${fmtD(n.followUp)} ${n.followUp <= TODAY ? pill("Due", "end") : ""}<div class="muted">${esc(n.text.slice(0, 90))}${n.text.length > 90 ? "…" : ""}</div></div>`).join("") || `<p class="muted small">Nothing due.</p>`}</div>
    <div class="panel"><h2>Charges for next invoices</h2><p class="sub">${pend.length} charge${pend.length === 1 ? "" : "s"} · ${money(pend.reduce((s, c) => s + chargeTotal(c), 0))}</p>${[...new Set(pend.map(c => c.tenantId))].slice(0, 6).map(tid => `<div class="small click" style="margin-bottom:4px" data-act="tenant" data-id="${tid}">${esc(tenantName(tid))} · ${money(pendingChargesOf(tid).reduce((s, c) => s + chargeTotal(c), 0))}</div>`).join("") || `<p class="muted small">None waiting.</p>`}</div></div>`;
}

Object.assign(FORMS, {
  booking: guard(async (fd, f) => {
    const r = resById(fd.get("resourceId")); const start = Number(fd.get("start")), end = start + Number(fd.get("dur")), date = fd.get("date");
    if (end > 24) return formErr("Bookings can't run past midnight.");
    if (end - start < (r.minHours || 1)) return formErr(`${r.name} needs at least ${r.minHours} hours.`);
    const clash = bkConflict(r.id, date, start, end); if (clash) return formErr(`That time overlaps ${bkWho(clash)} (${bkTime(clash)}).`);
    let tid = fd.get("tenantId");
    if (fd.get("method") === "nextcycle" && (tid === "__new" || !tenantHasLease(tid))) return formErr("Only tenants with an active lease can be billed on their next monthly invoice. Choose another way to pay.");
    if (tid === "__new") {
      const name = fd.get("nname").trim(); if (!name) return formErr("Enter the customer's name.");
      tid = uid("t"); const company = fd.get("ncompany").trim();
      await put("tenants", tid, { kind: company ? "business" : "personal", name: company || name, contacts: [{ name, title: "", email: fd.get("nemail").trim(), phone: fd.get("nphone").trim() }], contactPerson: name, email: fd.get("nemail").trim(), phone: fd.get("nphone").trim(), address: "", billingAddress: (fd.get("nbilling") || "").trim(), regNo: "", billingEmail: "", notes: "", placeholder: false, memberOnly: true, signupDate: TODAY, signupSource: "staff", createdAt: TODAY });
      await settle(() => !!tenantById(tid));
    }
    const btn = f.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Booking…";
    const id = await createBooking({ tenantId: tid, resourceId: r.id, date, start, end, credits: fd.get("useCredits") && fd.get("creditsToUse") != null ? Number(fd.get("creditsToUse")) || 0 : 0, method: fd.get("method"), depositCollected: !!fd.get("depositCollected"), notes: fd.get("notes").trim(), source: "admin" });
    closeModal(); toast(`${r.name} booked for ${fmtD(date)}, ${hLabel(start)}–${hLabel(end)}.`);
    await settle(() => S.bookings.some(b => b.id === id)); openModal(() => bookingDrawer(id));
  }),
  bkCancel: guard(async (fd, f) => {
    const b = S.bookings.find(x => x.id === f.dataset.id); const mode = fd.get("mode"), dest = fd.get("dest");
    const p = refundPreview(b, mode); const summary = cxPreviewText(b, mode, dest);
    const unpaid = bkInvoiceIds(b).map(id => S.invoices.find(i => i.id === id)).filter(i => i && i.status !== "void" && i.total > 0.005 && allocatedTo(i.id) <= 0.005);
    if (p.eligible) {
      for (const inv of unpaid) await patch("invoices", inv.id, { status: "void", voidedAt: new Date().toISOString(), voidReason: "Booking cancelled", voidedBy: S.userId || null });
      for (const c of (b.chargeIds || []).map(id => S.charges.find(x => x.id === id)).filter(Boolean)) {
        if (c.void) continue;
        if (!c.invoiceId) await patch("charges", c.id, { void: true, voidReason: "Booking cancelled" });
        else if (invStatus(S.invoices.find(i => i.id === c.invoiceId) || {}) !== "paid") await addCharges(b.tenantId, [{ desc: `Credit: cancelled ${b.resourceName} ${fmtD(b.date)} (${c.desc.slice(0, 60)})`, qty: c.qty || 1, price: -c.price, ...(c.noTax ? { noTax: true } : { taxRate: c.taxRate }) }], { source: "booking", bookingId: b.id });
      }
      const toSource = p.dest === "source" || (p.dest === "refund" && dest === "card");
      if (toSource && p.credits) for (const d of bkDraws(b)) {
        const w = S.wallets.find(x => x.id === d.walletId); if (!w) continue;
        await patch("wallets", w.id, { remaining: r2(Number(w.remaining) + d.amount) }); w.remaining = r2(Number(w.remaining) + d.amount);
        await put("creditTxns", uid("ct"), { tenantId: b.tenantId, walletId: w.id, walletType: w.type, delta: d.amount, kind: "refund", bookingId: b.id, date: TODAY, at: new Date().toISOString(), note: `Cancelled ${b.resourceName} ${fmtD(b.date)}` });
      }
      if (p.dest === "refund" && dest === "credits") {
        const amt = r2(p.credits + Math.round(p.cash));
        await addWallet(b.tenantId, { type: "refund", name: `Refund credits · ${b.resourceName} ${fmtD(b.date)}`, total: amt, expiresOn: addDays(addMonths(b.date, S.settings.refundCreditMonths), -1), bookingId: b.id }, { kind: "refund", bookingId: b.id, note: `Cancelled ${b.resourceName} ${fmtD(b.date)}` });
      }
      if (p.dest === "refund" && dest === "card") {
        const cn = uid("inv");
        await put("invoices", cn, { number: nextInvoiceNumber(monthKey(TODAY), []).replace(/^([^-]+)/, "CN"), tenantId: b.tenantId, locationId: b.locationId, kind: "creditnote", bookingId: b.id, period: monthKey(TODAY), issueDate: TODAY, dueDate: TODAY, lines: [{ desc: `Refund: cancelled ${b.resourceName} ${fmtD(b.date)}`, qty: 1, price: -p.cash, noTax: true }], subtotal: -p.cash, tax: 0, total: -p.cash, status: "issued", createdAt: new Date().toISOString() });
        await put("payments", uid("pay"), { tenantId: b.tenantId, date: TODAY, amount: -p.cash, method: "Refund to card/bank", reference: `Refund ${b.resourceName} ${b.date}`, allocations: [], source: "refund", createdAt: new Date().toISOString() });
      }
    }
    await patch("bookings", b.id, { status: "cancelled", cancelledAt: new Date().toISOString(), refund: { mode, dest: p.dest === "refund" ? dest : p.dest, credits: p.credits, cash: p.cash, eligible: p.eligible, hoursBefore: r2(p.hrs), summary } });

  bkExtend: guard(async (fd, f) => {
    const b = S.bookings.find(x => x.id === f.dataset.id); const r = resById(b.resourceId); const end = b.end + Number(fd.get("add"));

function creditBalanceAt(tid, d) {

/* ----- booking flow ----- */
function caFreeStarts(r, date, dur) {
  const out = []; const nowH = new Date().getHours() + new Date().getMinutes() / 60;
  for (let h = 7; h + dur <= 23.001; h += 0.5) {
    let ok = !bkConflict(r.id, date, h, h + dur);
    let why = ok ? "" : "Booked";
    if (ok && date === TODAY) { if (h <= nowH) { ok = false; why = "Past"; } else if (!(nowH >= S.settings.sameDayStart && nowH < S.settings.sameDayEnd)) { ok = false; why = "Same-day closed"; } }
    out.push({ h, ok, why });
  }
  return out;
}
function caStrip(r, date) {

  let shade = ""; for (let h = H0; h < H1; h++) if (isSurcharged(date, h)) shade += `<span class="ca-off" style="left:${(h - H0) * W}%;width:${W}%"></span>`;
  return `<div class="ca-strip">${shade}${bs.map(b => `<span class="ca-busy" style="left:${(Math.max(b.start, H0) - H0) * W}%;width:${(Math.min(b.end, H1) - Math.max(b.start, H0)) * W}%"></span>`).join("")}${CA.bk.start != null && CA.bk.resId === r.id ? `<span class="ca-sel" style="left:${(CA.bk.start - H0) * W}%;width:${CA.bk.dur * W}%"></span>` : ""}</div><div class="ca-axis"><span>7am</span><span>11am</span><span>3pm</span><span>7pm</span><span>11pm</span></div>`;
}

      ${pay > 0.005 || p.deposit ? `<div class="ca-card"><h3>Pay with</h3>${[["card", "Card", "Pay now · demo, no real charge"], ["account", "PayNow or bank transfer", `Invoice now, pay within ${S.settings.dueDays} days`], ...(lease ? [["nextcycle", "Add to my monthly invoice", "Billed with your next rent invoice"]] : [])].map(([v, l, s]) => `<label class="ca-radio"><input type="radio" name="caMethod" value="${v}" data-change="caBkMethod" ${k.method === v ? "checked" : ""}><span><b>${l}</b><small>${s}</small></span></label>`).join("")}</div>` : ""}
      <label class="ca-field"><span>Notes for the front desk (optional)</span><input type="text" id="caNotes" data-input="caBkNotes" value="${esc(k.notes)}" placeholder="e.g. need extra chairs, visitor names"></label>

/* ----- my bookings ----- */

  const up = all.filter(b => b.status !== "cancelled" && ["upcoming", "ongoing"].includes(bkState(b))).sort(by(b => b.date + String(Math.round(b.start * 100)).padStart(4, "0")));

    ${list.map(caBookingCard).join("") || `<div class="ca-card ca-empty">${CA.bTab === "upcoming" ? "No upcoming bookings." : "Nothing here yet."}<button class="ca-link" data-act="caBookNew">Book a room</button></div>`}</section>`;

/* ----- billing ----- */
function caBilling(me) {
  const due = caDue(me.id); const lfA = lateFeesAccrued(me.id); const dueAmt = due.reduce((s, i) => s + invBalance(i), 0) + lfA;

  const paidList = invs.filter(i => invBalance(i) <= 0.005).sort(by(i => i.issueDate, -1));
  const waiting = caWaiting(me.id); const pays = S.payments.filter(p => p.tenantId === me.id).sort(by(p => p.date, -1));
  const tab = CA.billTab; const seg = (v, l) => `<button data-act="caSet" data-k="billTab" data-v="${v}" ${tab === v ? 'aria-pressed="true"' : ""}>${l}</button>`;
  const invRow = i => { const s = invStatus(i); return `<button class="ca-row" data-act="caInvoice" data-id="${i.id}"><span class="ca-av sq">${s === "paid" ? "✓" : "$"}</span><span><b>${esc(i.number)}</b><small>${esc(INV_KIND[i.kind] || "Invoice")} · ${s === "paid" ? "paid" : "due " + fmtD(i.dueDate)}</small></span><span class="ca-amt"><b>${i.total <= 0.005 ? "Credits" : money(s === "paid" ? i.total : invBalance(i) + ((f => f && !f.settled ? f.total : 0)(lateFeeDue(i))))}</b><i class="ca-pill ${s === "overdue" ? "bad" : s === "paid" ? "ok" : "info"}">${INV_ST[s][0]}</i></span></button>`; };

/* ======================================================================
   LATE FEES (rules from finance):
   - Rate: lateFeeRate % p.a. (12) on the RENTAL amount before GST.
   - Grace: if paid more than graceDays (13) after the due date, the fee
     counts every day from the due date: days = payment date − due date.
   - Fee = days / 365 × rate × rental; GST is added on top of the fee.
   - Accrues daily until paid; when the invoice is settled the fee is
     finalised as its own "Late fee" invoice dated the payment date.
   - Staff can waive the late fee on any invoice (reason + audit).
   ====================================================================== */
const LF_KINDS = ["rent", "upfront"];
const lfRentBase = inv => r2((inv.lines || []).filter(l => !l.deposit && !l.chargeId && !l.lateFeeFor && (Number(l.qty) || 0) * (Number(l.price) || 0) > 0).reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.price) || 0), 0));
const lfGstRate = () => S.settings.lateFeeGst === false ? 0 : (Number(S.settings.bookingTaxRate) || 0);
function lfAllocTimeline(inv) {
  const out = [];
  for (const p of S.payments) for (const a of (p.allocations || [])) if (a.invoiceId === inv.id && Number(a.amount) > 0) out.push({ date: p.date, amount: Number(a.amount) });
  return out.sort(by(x => x.date));
}
/* returns null when no late fee applies; otherwise { amount, gst, total, days, base, from, to, settled, waived } */
function lateFeeFor(inv, asOf = TODAY) {
  if (!inv || inv.status === "void" || !LF_KINDS.includes(inv.kind) || !(Number(S.settings.lateFeeRate) > 0)) return null;
  const base = lfRentBase(inv); if (base <= 0.005 || !inv.dueDate) return null;
  if (S.settings.lateFeeFromDue && inv.dueDate < S.settings.lateFeeFromDue) return null;
  const total = Number(inv.total) || 0; if (total <= 0.005) return null;
  const tl = lfAllocTimeline(inv);
  let paid = 0, settledOn = null;
  for (const a of tl) { paid += a.amount; if (paid >= total - 0.005) { settledOn = a.date; break; } }
  const end = settledOn || asOf;
  const days = diffDays(inv.dueDate, end);
  if (days <= (Number(S.settings.graceDays) || 0)) return null;
  // accrue on the unpaid share of the rental, segment by segment between payments
  const startFrom = inv.lateFeeBilledThrough && inv.lateFeeBilledThrough > inv.dueDate ? inv.lateFeeBilledThrough : inv.dueDate;
  let cur = inv.dueDate, out = total, fee = 0;
  const pts = tl.filter(a => a.date <= end);
  const stepTo = (d) => { const a = maxD(cur, startFrom), b = d; if (b > a) fee += base * (Math.max(0, out) / total) * diffDays(a, b) / 365 * (Number(S.settings.lateFeeRate) / 100); cur = maxD(cur, d); };
  for (const a of pts) { if (a.date > cur) stepTo(a.date); out -= a.amount; }
  if (end > cur) stepTo(end);
  const amount = r2(fee); const gst = r2(amount * lfGstRate() / 100);
  return { amount, gst, total: r2(amount + gst), days, base, from: startFrom, to: end, settled: !!settledOn, waived: !!inv.lateFeeWaived, billed: (inv.lateFeeInvoiceIds || []).length > 0 };
}
/* fee still to charge (0 if waived or already finalised) */
function lateFeeDue(inv, asOf = TODAY) { const f = lateFeeFor(inv, asOf); if (!f || f.waived || inv.lateFeeFinal || f.amount <= 0.005) return null; return f; }
function lateFeeLine(inv, f) { return { desc: `Late payment fee on ${inv.number}: ${f.days} days late (due ${fmtD(inv.dueDate)}, ${f.settled ? "paid" : "to"} ${fmtD(f.to)}), ${S.settings.lateFeeRate}% p.a. on ${money(f.base)} rental`, qty: 1, price: f.amount, taxRate: lfGstRate(), lateFeeFor: inv.id }; }
async function billLateFee(inv, f, { final = f.settled, issue = TODAY } = {}) {
  const id = final ? `lf-${inv.id}` : uid("inv");
  if (S.invoices.some(i => i.id === id)) return id;
  const lines = [lateFeeLine(inv, f)]; const t = calcTotals(lines, lfGstRate());
  await put("invoices", id, { number: nextInvoiceNumber(monthKey(issue), []), tenantId: inv.tenantId, locationId: inv.locationId, leaseId: inv.leaseId || null, unitCode: inv.unitCode || "", kind: "latefee", period: monthKey(issue), issueDate: issue, dueDate: addDays(issue, Number(S.settings.dueDays) || 0), lines, ...t, taxRate: lfGstRate(), status: "issued", sentAt: null, createdAt: new Date().toISOString(), createdBy: "latefee", lateFeeFor: inv.id, ...(inv.sample ? { sample: true } : {}) });

    if (qr && qr.size && S.assets) { try { const r = await S.assets.upload(qr); qrAssetId = r.id; } catch (e) { return toast("Couldn't upload the QR image: " + (e.code || "error")); } }
    if (fd.get("qrRemove")) qrAssetId = "";
    const doc = { ...S.settings, lateFeeRate: Math.max(0, n("lateFeeRate", 12)), graceDays: Math.max(0, n("graceDays", 13)), lateFeeFromDue: fd.get("lateFeeFromDue") || "", lateFeeGst: !!fd.get("lateFeeGst"), invoiceAdvanceDays: Math.min(28, Math.max(0, n("invoiceAdvanceDays", 7))), depositMonths: Math.max(0, n("depositMonths", 2)), reminderDays: reminderStagesFrom(fd.get("reminderDays")), autoReminders: !!fd.get("autoReminders"), autoHouseRules: !!fd.get("autoHouseRules"), bankName: fd.get("bankName").trim(), bankAccountName: fd.get("bankAccountName").trim(), bankAccountNo: fd.get("bankAccountNo").trim(), payNowId: fd.get("payNowId").trim(), qrAssetId, houseRulesSubject: fd.get("houseRulesSubject"), houseRulesBody: fd.get("houseRulesBody") };
    await S.db.doc("settings/billing").set(doc);
    await audit("settings.billing", { summary: `Updated billing settings: late fee ${doc.lateFeeRate}% p.a., grace ${doc.graceDays} days, invoices ${doc.invoiceAdvanceDays} days in advance, reminders on days ${doc.reminderDays}` });
    toast("Settings saved.");
  })
});
function reminderStagesFrom(v) { return String(v || "").split(/[,\s]+/).map(Number).filter(x => x > 0).sort((a, b) => a - b).join(", "); }
boot();
</script>
