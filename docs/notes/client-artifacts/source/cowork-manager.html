<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cowork Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --paper:#ECEFF2; --surface:#FFFFFF; --surface2:#F6F8F9; --ink:#1B2731; --muted:#5D6C78; --line:#D3DAE0;
  --brass:#A4762A; --brass-soft:#F3E8D3;
  --occ:#2C6B66; --occ-soft:#DCEBE9; --end:#B97A12; --end-soft:#F7EAD2; --hand:#674A98; --hand-soft:#ECE5F6;
  --res:#2F67A3; --res-soft:#DFEAF6; --vac:#8A97A2; --bad:#B03A3A; --bad-soft:#F6E0E0; --good:#2C7A4B;
  --radius-s:6px; --radius-m:10px;
  --font:"Schibsted Grotesk", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141B21; --surface:#1C252D; --surface2:#222D36; --ink:#E4EAEE; --muted:#9AA8B3; --line:#33414C;
    --brass:#D2A65A; --brass-soft:#3A3122;
    --occ:#5FB0A8; --occ-soft:#1F3634; --end:#E0A447; --end-soft:#3B2F1A; --hand:#A88BDA; --hand-soft:#2E2640;
    --res:#73A6DE; --res-soft:#1F2F42; --vac:#6E7C87; --bad:#E07C7C; --bad-soft:#3D2323; --good:#6CC08E; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
    --paper:#141B21; --surface:#1C252D; --surface2:#222D36; --ink:#E4EAEE; --muted:#9AA8B3; --line:#33414C;
    --brass:#D2A65A; --brass-soft:#3A3122;
    --occ:#5FB0A8; --occ-soft:#1F3634; --end:#E0A447; --end-soft:#3B2F1A; --hand:#A88BDA; --hand-soft:#2E2640;
    --res:#73A6DE; --res-soft:#1F2F42; --vac:#6E7C87; --bad:#E07C7C; --bad-soft:#3D2323; --good:#6CC08E; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--res)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
aside.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--ink);display:grid;place-items:center;color:var(--paper);font-weight:800;font-size:14px;position:relative}
.brand-mark::after{content:"";position:absolute;top:4px;width:5px;height:5px;border-radius:50%;background:var(--brass)}
.brand b{font-size:16px;letter-spacing:-.01em}
.locpick label{font-size:12px;color:var(--muted);display:block;margin:0 6px 4px}
.locpick select{width:100%}
nav.menu{display:flex;flex-direction:column;gap:2px}
nav.menu button{all:unset;cursor:pointer;padding:8px 10px;border-radius:var(--radius-s);display:flex;justify-content:space-between;align-items:center;color:var(--ink);font-weight:500}
nav.menu button:hover{background:var(--surface2)}
nav.menu button[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav.menu .count{font-size:12px;background:var(--end-soft);color:var(--end);border-radius:20px;padding:0 7px;font-weight:600}
nav.menu button[aria-current="page"] .count{background:var(--brass);color:#fff}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 6px}
main{padding:22px 28px 60px;min-width:0}
.topbar{display:none}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head h1{font-size:28px;line-height:1.1;margin:0;letter-spacing:-.02em;font-weight:700}
.page-head p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--radius-s);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
a.btn{color:var(--ink);text-decoration:none;display:inline-block}
a.btn.primary{color:var(--paper)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.small{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{all:unset;cursor:pointer;color:var(--res);font-weight:500}
.link:hover{text-decoration:underline}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:7px 9px;min-width:0}
textarea{width:100%;min-height:70px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px 18px;min-width:0}
.panel h2{font-size:16px;margin:0 0 2px;font-weight:650}
.panel .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-dash{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);margin-bottom:16px}
.kpis.kpis5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis.kpis6{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis.kpis6 .kpi:nth-child(4){border-left:0}
.kpis.kpis6 .kpi:nth-child(n+4){border-top:1px solid var(--line)}
.kpi{padding:16px 18px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px}
.kpi .d{font-size:13px;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:8px;display:flex}
.bar span{display:block;height:100%}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface2)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:20px;white-space:nowrap;background:var(--surface2);color:var(--muted)}
.pill.occ{background:var(--occ-soft);color:var(--occ)} .pill.end{background:var(--end-soft);color:var(--end)}
.pill.hand{background:var(--hand-soft);color:var(--hand)} .pill.res{background:var(--res-soft);color:var(--res)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.good{background:var(--occ-soft);color:var(--good)}
.pill.brass{background:var(--brass-soft);color:var(--brass)}
.muted{color:var(--muted)} .small{font-size:13px} .right{text-align:right} .nowrap{white-space:nowrap}
.empty{padding:26px;text-align:center;color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 11px;cursor:pointer;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.banner{border:1px solid var(--line);border-left:4px solid var(--brass);background:var(--surface);padding:10px 14px;border-radius:var(--radius-s);margin-bottom:14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.bad{border-left-color:var(--bad)}

/* Floor board: unit tiles styled as key tags */
.zone{margin-bottom:22px}
.zone-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.zone-head h3{margin:0;font-size:15px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.tag{all:unset;box-sizing:border-box;cursor:pointer;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:10px 10px 8px 8px;padding:16px 10px 9px;min-height:96px;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.tag::before{content:"";position:absolute;top:6px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.tag::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--st,var(--vac))}
.tag:hover{border-color:var(--muted)}
.tag .code{font-weight:700;font-size:16px;letter-spacing:-.01em}
.tag .meta{font-size:12px;color:var(--muted)}
.tag .who{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag .until{font-size:11.5px;color:var(--muted)}
.tag .conv{position:absolute;top:6px;right:8px;font-size:10.5px;font-weight:600;color:var(--hand)}
.tag .when{font-size:11.5px;font-weight:600;color:var(--st)}
.tag.vacant{background:repeating-linear-gradient(135deg,var(--surface),var(--surface) 6px,var(--surface2) 6px,var(--surface2) 12px)}
.tag.archived{opacity:.55}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* Modal / drawer */
.overlay{position:fixed;inset:0;background:rgba(15,22,28,.42);display:flex;justify-content:flex-end;z-index:20}
.overlay.center{justify-content:center;align-items:center;padding:16px}
.drawer{background:var(--paper);width:min(640px,100%);height:100%;overflow:auto;padding:20px 22px calc(40px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line);animation:slide .18s ease-out}
.dialog{background:var(--paper);width:min(620px,100%);max-height:92vh;overflow:auto;padding:20px 22px;border-radius:var(--radius-m);border:1px solid var(--line)}
.dialog.wide{width:min(980px,100%)}
@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.drawer{animation:none}}
.m-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.m-head h2{margin:0;font-size:22px;letter-spacing:-.015em}
.x{all:unset;cursor:pointer;font-size:22px;line-height:1;padding:2px 8px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--surface2)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.form .full{grid-column:1/-1}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea{width:100%}
.hint{font-size:12.5px;color:var(--muted)}
.err{font-size:13px;color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:14px;background:var(--surface)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.section{margin-top:18px}
.section h3{font-size:14px;margin:0 0 8px;font-weight:650}
.kv{display:grid;grid-template-columns:140px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.timeline{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 12px 16px}
.timeline li::before{content:"";position:absolute;left:-7px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--st,var(--vac))}
.lines td input{width:100%}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:90vw}
.invoice-doc{background:#fff;color:#1B2731;border:1px solid var(--line);border-radius:var(--radius-s);padding:24px}
.invoice-doc table td,.invoice-doc table th{border-color:#dde3e8;color:#1B2731}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted)}

/* booking timeline */
.tl-wrap{overflow-x:auto;padding:0 0 6px}
.tl{min-width:calc(170px + 24 * var(--hw))}
.tl-row{display:flex;border-top:1px solid var(--line);min-height:52px}
.tl-head{border-top:0;min-height:22px}
.tl-label{width:170px;flex:none;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;position:sticky;left:0;background:var(--surface);z-index:2;font-size:13.5px;border-right:1px solid var(--line)}
.tl-track{position:relative;flex:none;width:calc(24 * var(--hw));cursor:copy}
.tl-head .tl-track{cursor:default}
.tl-hour{position:absolute;top:3px;font-size:11px;color:var(--muted);padding-left:4px}
.tl-cell{position:absolute;top:0;bottom:0;width:var(--hw);border-left:1px solid var(--line)}
.tl-cell.off,.legend i.hatch{background:repeating-linear-gradient(135deg,transparent,transparent 5px,var(--surface2) 5px,var(--surface2) 10px)}
.legend i.hatch{border:1px solid var(--line)}
.tl-bk{all:unset;box-sizing:border-box;cursor:pointer;position:absolute;top:5px;bottom:5px;margin-left:1px;border-radius:6px;background:var(--c);color:#fff;padding:3px 7px;font-size:12px;line-height:1.25;overflow:hidden;display:flex;flex-direction:column;z-index:1}
.tl-bk b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-bk span{opacity:.9;white-space:nowrap}
.tl-bk:hover{filter:brightness(1.08)}
.tl-now{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:1}
.field label{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:3px 0}
.field input[type=checkbox],.field input[type=radio]{width:auto;margin:3px 6px 0 0;flex:none}
.field>span:has(>input[type=checkbox]){display:flex;align-items:flex-start;color:var(--ink);font-size:14px}
@media (max-width: 1250px){ .kpis.kpis5 .kpi .v{font-size:24px} }

/* ===== customer app (BizPlus) ===== */
body.cust .app{display:none}
body.cust{background:var(--paper);--ca-acc:#1F6F66;--ca-acc-soft:#DDEDEA;--ca-warm:#E8935B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body.cust{--ca-acc:#5FB0A8;--ca-acc-soft:#1F3634}}
:root[data-theme="dark"] body.cust{--ca-acc:#5FB0A8;--ca-acc-soft:#1F3634}
.ca{--ca-acc:#1F6F66;--ca-acc-soft:#DDEDEA;--ca-warm:#E8935B;max-width:520px;margin:0 auto;min-height:100vh;background:var(--surface);position:relative;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;font-size:15px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ca{--ca-acc:#5FB0A8;--ca-acc-soft:#1F3634}}
:root[data-theme="dark"] .ca{--ca-acc:#5FB0A8;--ca-acc-soft:#1F3634}
.ca-load{padding:80px 20px;text-align:center;color:var(--muted)}
.ca-top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.ca-brand{display:flex;gap:10px;align-items:center}.ca-brand b{display:block;font-size:16px;line-height:1.1}.ca-brand small{color:var(--muted);font-size:12px}
.ca-logo{width:32px;height:32px;border-radius:10px;background:var(--ca-acc);color:#fff;display:grid;place-items:center;font-weight:800}
.ca-logo.big{width:56px;height:56px;border-radius:16px;font-size:26px;margin:0 auto 12px}
.ca-avatar,.ca-av{width:36px;height:36px;border-radius:50%;background:var(--ca-acc-soft);color:var(--ca-acc);display:grid;place-items:center;font-weight:700;border:0;cursor:pointer;flex:none}
.ca-av.sq{border-radius:10px;font-size:15px}.ca-av.big{width:52px;height:52px;font-size:22px}
.ca-body{flex:1;padding-bottom:84px}
.ca-pad{padding:16px}.ca-pad-s{padding:10px 14px}
.ca-h1{font-size:24px;margin:4px 0 2px;letter-spacing:-.02em}.ca-h2{font-size:16px;margin:22px 0 8px}
.ca-muted{color:var(--muted);margin:0 0 12px;font-size:14px}.ca-note{color:var(--muted);font-size:13px;margin:8px 2px}
.ca-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.ca-card.flush{padding:0;overflow:hidden}.ca-card h3{margin:0 0 10px;font-size:15px}
.ca-card.ca-empty{text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:6px;align-items:center}
.ca-credit{cursor:pointer;margin:14px 0;padding:18px;border-radius:18px;background:linear-gradient(135deg,var(--ca-acc),#2E8A7F);color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ca-credit small{display:block;opacity:.85;font-size:13px}.ca-credit b{display:block;font-size:38px;line-height:1.1;letter-spacing:-.02em}.ca-credit span{font-size:13px;opacity:.85}
.ca-exp{background:rgba(255,255,255,.18);border-radius:20px;padding:4px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.ca-quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ca-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-size:15px}
.ca-btn.primary{background:var(--ca-acc);border-color:var(--ca-acc);color:#fff}.ca-btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.ca-btn.block{display:flex;width:100%;margin:10px 0}.ca-btn.big{padding:15px;font-size:16px}.ca-btn.small{padding:6px 12px;font-size:13px;border-radius:10px}.ca-btn.ghost{border-color:transparent;color:var(--muted)}
.ca-btn:disabled{opacity:.45;cursor:not-allowed}
.ca-link{all:unset;cursor:pointer;color:var(--ca-acc);font-weight:600;font-size:14px;display:block;margin:6px 0}.ca-link.center{text-align:center;margin:14px auto}
.ca-due{display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-left:4px solid var(--ca-acc)}.ca-due.bad{border-left-color:var(--bad)}
.ca-due small{color:var(--muted);font-size:13px;display:block}.ca-due b{font-size:24px;display:block}.ca-due span{font-size:13px;color:var(--muted)}
.ca-ok b{display:block}
.ca-bk{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:center;width:100%;padding:10px;border:1px solid var(--line);border-radius:14px;margin:8px 0;background:var(--surface)}
.ca-bk img,.ca-ph{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:linear-gradient(135deg,var(--ca-acc-soft),var(--brass-soft))}
.ca-ph.tall{width:100%;height:150px;border-radius:0;display:block}
.ca-bk-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.ca-bk-t small{color:var(--muted);font-size:13px}
.ca-chev{color:var(--muted);font-size:22px}
.ca-pill{font-style:normal;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--surface2);color:var(--muted)}
.ca-pill.ok{background:var(--occ-soft);color:var(--good)}.ca-pill.bad{background:var(--bad-soft);color:var(--bad)}.ca-pill.info{background:var(--res-soft);color:var(--res)}
.ca-days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}

<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="brand-mark">C</div><b>Cowork Manager</b></div>
    <div class="locpick"><label for="locSel">Location</label><select id="locSel"></select></div>
    <nav class="menu" id="menu"></nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>
  <div>
    <div class="topbar"><button class="btn small" data-act="toggleMenu" aria-label="Open menu">Menu</button><b id="topTitle">Cowork Manager</b></div>
    <main id="main"><div class="loading">Loading your spaces…</div></main>
  </div>
</div>
<div id="custRoot"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>"use strict";
/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const TODAY = iso(new Date());
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return iso(d); };
const addMonths = (s,n) => { const d = parseD(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const dim = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day, dim)); return iso(d); };
const diffDays = (a,b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const monthKey = s => s.slice(0,7);
const monthStart = k => k + "-01";
const monthEnd = k => { const [y,m] = k.split("-").map(Number); return `${k}-${pad(new Date(y, m, 0).getDate())}`; };
const daysInMonth = k => Number(monthEnd(k).slice(8));
const shiftMonth = (k,n) => monthKey(addMonths(monthStart(k), n));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtD = s => { if (!s) return "—"; const [y,m,d] = s.split("-"); return `${Number(d)} ${MON[Number(m)-1]} ${y}`; };
const fmtM = k => { const [y,m] = k.split("-"); return `${MON[Number(m)-1]} ${y}`; };
const r2 = n => Math.round((Number(n)||0) * 100) / 100;
const money = n => { const c = S.settings.currency || "$"; const v = r2(n); return (v < 0 ? "−" : "") + c + Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2, maximumFractionDigits:2}); };
const money0 = n => (S.settings.currency || "$") + Math.round(n).toLocaleString();
const pct = (a,b) => b ? Math.round(a / b * 100) : 0;
const uid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const by = (f, dir=1) => (a,b) => { const x=f(a), y=f(b); return x<y ? -dir : x>y ? dir : 0; };
const maxD = (a,b) => a > b ? a : b;
const minD = (a,b) => a < b ? a : b;

/* ---------- unit types & payment methods ---------- */
const UNIT_T = { office: "Office suite", desk: "Hot desk", fixed: "Fixed desk" };
const unitMeta = u => u.type === "office" ? `Suite · ${u.pax} pax` : UNIT_T[u.type] || "Desk";
const METHOD_NAME = { card: "Card", transfer: "Bank transfer / PayNow", giro: "GIRO", cheque: "Cheque", account: "Invoice (pay later)", nextcycle: "Next monthly invoice", credits: "Credits" };
const methodName = m => METHOD_NAME[m] || m;
const methodLabel = m => /^(Bank transfer|PayNow)$/i.test(m || "") ? "Bank transfer / PayNow" : (m || "");
function methodOptions(opts = {}) {
  const keys = ["card", "transfer", ...(opts.extra || []), ...(opts.account === false ? [] : ["account"]), ...(opts.nextcycle ? ["nextcycle"] : [])];
  return keys.map(k => `<option value="${k}" ${opts.sel === k ? "selected" : ""}>${METHOD_NAME[k]}</option>`).join("");
}

/* ---------- state ---------- */
const DEFAULT_SETTINGS = { businessName:"", businessAddress:"", currency:"$", taxRate:0, taxLabel:"Tax", dueDays:7, autoBilling:true, prorate:true, invoicePrefix:"INV", billingRuns:{}, endingWindowDays:90, gstRegNo:"",
  lateFeeRate:12, graceDays:13, lateFeeGst:true, invoiceAdvanceDays:7, reminderDays:"3, 7, 14", depositMonths:2,
  bankName:"", bankAccountName:"", bankAccountNo:"", payNowId:"", qrAssetId:"",
  houseRulesSubject:"Welcome to {centre}: house rules", houseRulesBody:"Hi {name},\n\nWelcome to {centre}! Your tenancy for unit {unit} starts today.\n\nHouse rules:\n1. Office hours are Mon–Fri 9am–7pm and Sat 9am–2pm. Access outside these hours is by access card.\n2. Please keep shared areas, pantry and meeting rooms tidy after use.\n3. Meeting rooms and the event space are booked through the BizPlus app.\n4. No smoking anywhere on the premises.\n5. Report any faults to the facility manager.\n\nWe're glad to have you with us.\n\n{business}",
  bookingTaxRate:9, airconRate:40, wkStart:9, wkEnd:19, satStart:9, satEnd:14, cancelCutoffHours:12, refundCreditMonths:1, sameDayStart:9, sameDayEnd:16, creditRuns:{},
  packages:[{credits:200, price:190, months:1},{credits:500, price:450, months:3},{credits:1000, price:850, months:6}] };
const COLS = ["locations","units","tenants","leases","invoices","payments","agreements","resources","bookings","wallets","creditTxns","creditPlans","charges","conversions","emails","tenantNotes","audit"];
const S = {
  db:null, user:null, assets:null, downloads:null, mode:"loading", canWrite:true,
  loaded:{}, settings:{...DEFAULT_SETTINGS},
  locations:[], units:[], tenants:[], leases:[], invoices:[], payments:[], agreements:[], resources:[], bookings:[], wallets:[], creditTxns:[], creditPlans:[], conversions:[], charges:[], emails:[], tenantNotes:[], audit:[], userId:null, isAdmin:false, names:{},
  view:"dashboard", loc:"all",
  ui:{ drawerTab:"overview", mailTab:"outbox", boardType:"all", boardStatus:"all", boardDate:TODAY, showArchived:false, tenantQ:"", tenantKind:"all", tenantStatus:"current",
       leaseFilter:"active", invMonth:"all", invStatus:"all", invQ:"", stmtTenant:"", stmtFrom:"", stmtTo:TODAY, payQ:"", bkDate:TODAY, bkView:"day", bkFilter:"upcoming", bkKind:"all", crQ:"", tenantSeg:"tenants" }
};

/* ---------- derived data ---------- */
const inLoc = x => S.loc === "all" || x.locationId === S.loc;
const unitById = id => S.units.find(u => u.id === id);
const tenantById = id => S.tenants.find(t => t.id === id);
const locById = id => S.locations.find(l => l.id === id);
const leaseValid = l => !(l.end && l.end < l.start) && !(l.end && l.end === l.start && l.dataIssue);
const leaseOn = (l, d) => leaseValid(l) && l.start <= d && (!l.end || l.end >= d);
const tenantName = id => { const t = tenantById(id); return t ? t.name : ""; };
const leaseWho = l => l.tenantId ? (tenantName(l.tenantId) || "Unknown tenant") : (l.occupantLabel || "Past occupant");
/* a unit is live on a date unless archived, outside its activeFrom/activeTo range, or inside a conversion gap (split into desks / merged) */
const unitLiveOn = (u, d = TODAY) => u.status !== "archived" && (!u.activeFrom || u.activeFrom <= d) && (!u.activeTo || u.activeTo >= d) && !(u.gaps || []).some(g => g.from <= d && (!g.to || g.to >= d));
const activeUnits = (d = TODAY) => S.units.filter(u => unitLiveOn(u, d) && inLoc(u));
function leasesOfUnit(uid) { return S.leases.filter(l => l.unitId === uid).sort(by(l => l.start)); }

function unitState(u, d = TODAY) {
  const ls = leasesOfUnit(u.id).filter(leaseValid);
  const cur = ls.find(l => leaseOn(l, d)) || null;
  const next = ls.find(l => l.start > d && (!cur || l.id !== cur.id)) || null;
  const win = S.settings.endingWindowDays || 90;
  let status = "vacant";
  if (cur) {
    if (cur.end && next && diffDays(cur.end, next.start) <= 7) status = "handover";
    else if (cur.end && diffDays(d, cur.end) <= win) status = "ending";
    else status = "occupied";
  } else if (next) status = "reserved";
  return { cur, next, status };
}
const STATUS = {
  occupied:{label:"Occupied", cls:"occ", color:"var(--occ)"},
  ending:{label:"Ending soon", cls:"end", color:"var(--end)"},
  handover:{label:"Handover booked", cls:"hand", color:"var(--hand)"},
  reserved:{label:"Reserved", cls:"res", color:"var(--res)"},
  vacant:{label:"Vacant", cls:"", color:"var(--vac)"}
};

function occupancy(d = TODAY, units = activeUnits(d)) {
  const out = {};
  for (const t of ["office","desk","fixed"]) {
    const us = units.filter(u => u.type === t);
    let occ = 0, seats = 0, seatsOcc = 0;
    for (const u of us) { seats += Number(u.pax)||0; if (S.leases.some(l => l.unitId === u.id && leaseOn(l, d))) { occ++; seatsOcc += Number(u.pax)||0; } }
    out[t] = { total: us.length, occ, seats, seatsOcc };
  }
  out.desks = ["occ","total","seats","seatsOcc"].reduce((o,k) => (o[k] = out.desk[k] + out.fixed[k], o), {});
  out.all = ["occ","total","seats","seatsOcc"].reduce((o,k) => (o[k] = out.office[k] + out.desks[k], o), {});
  return out;
}

/* invoices & payments */
function allocatedTo(invId) { let s = 0; for (const p of S.payments) for (const a of (p.allocations||[])) if (a.invoiceId === invId) s += Number(a.amount)||0; return r2(s); }
function invBalance(inv) { return inv.status === "void" ? 0 : r2(inv.total - allocatedTo(inv.id)); }
function invStatus(inv) {
  if (inv.status === "void") return "void";
  const bal = invBalance(inv);
  if (bal <= 0.005) return "paid";
  if (inv.dueDate < TODAY) return "overdue";
  if (bal < inv.total - 0.005) return "partial";
  return "open";
}
const INV_ST = { paid:["Paid","good"], overdue:["Overdue","bad"], partial:["Part paid","end"], open:["Open","res"], void:["Void",""] };
function payUnallocated(p) { return r2(p.amount - (p.allocations||[]).reduce((s,a) => s + (Number(a.amount)||0), 0)); }
function tenantBalance(tid) {
  let b = 0;
  for (const i of S.invoices) if (i.tenantId === tid && i.status !== "void") b += i.total;
  for (const p of S.payments) if (p.tenantId === tid) b -= p.amount;
  return r2(b);
}
function aging(invs) {
  const b = { current:0, d30:0, d60:0, d90:0, d90p:0 };
  for (const i of invs) {
    const bal = invBalance(i); if (bal <= 0.005) continue;
    const late = diffDays(i.dueDate, TODAY);
    if (late <= 0) b.current += bal; else if (late <= 30) b.d30 += bal; else if (late <= 60) b.d60 += bal; else if (late <= 90) b.d90 += bal; else b.d90p += bal;
  }
  return b;
}
const invInLoc = i => S.loc === "all" || i.locationId === S.loc;
const tenantLeases = tid => S.leases.filter(l => l.tenantId === tid).sort(by(l => l.start));
function tenantStatus(t) {
  if (t.memberOnly && !S.leases.some(l => l.tenantId === t.id)) return "member";
  const ls = tenantLeases(t.id).filter(leaseValid);
  if (ls.some(l => leaseOn(l, TODAY))) return "current";
  if (ls.some(l => l.start > TODAY)) return "incoming";
  if (ls.length) return "past";
  return "prospect";
}
const tenantInLoc = t => S.loc === "all" || S.leases.some(l => l.tenantId === t.id && l.locationId === S.loc) || (!S.leases.some(l => l.tenantId === t.id));

function nextInvoiceNumber(period, used) {
  const yymm = period.slice(2,4) + period.slice(5,7);
  const pre = `${S.settings.invoicePrefix || "INV"}-${yymm}-`;
  let max = 0;
  for (const i of S.invoices) if (i.number && i.number.startsWith(pre)) max = Math.max(max, Number(i.number.slice(pre.length)) || 0);
  for (const n of used) if (n.startsWith(pre)) max = Math.max(max, Number(n.slice(pre.length)) || 0);
  const num = pre + String(max + 1).padStart(3, "0");
  used.push(num);
  return num;
}
function calcTotals(lines, rate = S.settings.taxRate) {
  const amt = l => (Number(l.qty)||0) * (Number(l.price)||0);
  const subtotal = r2(lines.reduce((s,l) => s + amt(l), 0));
  const tax = r2(Math.max(0, lines.filter(l => !l.noTax).reduce((s,l) => s + amt(l) * (Number(l.taxRate ?? rate) || 0) / 100, 0)));
  return { subtotal, tax, total: r2(subtotal + tax) };
}
function rentLineFor(lease, period) {
  const ms = monthStart(period), me = monthEnd(period);
  if (!leaseValid(lease)) return null;
  const from = lease.prepaidThrough ? maxD(lease.start, addDays(lease.prepaidThrough, 1)) : lease.start;
  const s = maxD(from, ms), e = minD(lease.end || me, me);
  if (s > e) return null;
  const days = diffDays(s, e) + 1, dim = daysInMonth(period);
  const full = days >= dim;
  const amt = (!full && S.settings.prorate) ? r2(lease.rate * days / dim) : r2(lease.rate);
  const desc = `Rent: unit ${lease.unitCode}, ${Number(s.slice(8))}–${Number(e.slice(8))} ${fmtM(period)}` + ((!full && S.settings.prorate) ? ` (${days}/${dim} days)` : "");
  return { desc, qty:1, price:amt };
}
function pendingRent(period) {
  const out = [];
  for (const l of S.leases) {
    if (!l.tenantId || !leaseValid(l)) continue;
    const line = rentLineFor(l, period); if (!line) continue;
    const dup = S.invoices.some(i => i.kind === "rent" && i.leaseId === l.id && i.period === period && i.status !== "void");
    if (!dup) out.push({ lease:l, line });
  }
  return out;
}

/* ---------- persistence ---------- */
async function put(col, id, data) { await S.db.doc(`${col}/${id}`).set(data); }
async function patch(col, id, data) { await S.db.doc(`${col}/${id}`).update(data); }
async function remove(col, id) { await S.db.doc(`${col}/${id}`).delete(); }
async function writeMany(ops, size = 5) {
  for (let i = 0; i < ops.length; i += size) await Promise.all(ops.slice(i, i+size).map(f => f()));
}
function guard(fn) {
  return async (...args) => {
    if (!S.db) { toast("Saving is unavailable in this view."); return; }
    if (!S.canWrite) { toast("You have view-only access to this portal."); return; }
    try { return await fn(...args); }
    catch (e) {
      console.error(e);
      const code = e && e.code;
      if (code === "invalid_argument") { toast("That change was refused. You may only have view access."); }
      else if (code === "quota_exceeded") toast("Storage is full. Delete old records, then try again.");
      else if (code === "resource_exhausted") toast("Too many changes at once. Wait a moment and try again.");
      else toast("Couldn't save: " + (e && e.message ? e.message : "unknown error"));
    }
  };
}

/* ---------- toast ---------- */
let toastT;
function toast(msg) { $("#toastRoot").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => $("#toastRoot").innerHTML = "", 3600); }

/* ---------- modal stack ---------- */
const modals = [];
function openModal(fn, kind = "drawer", live = true) { modals.push({fn, kind, live}); renderModals(); }
function closeModal() { modals.pop(); renderModals(); }
function closeAll() { modals.length = 0; renderModals(); }
function renderModals(onlyLive = false) {
  const root = $("#modalRoot");
  if (!modals.length) { root.innerHTML = ""; return; }
  if (onlyLive && !modals[modals.length-1].live) return;

  if (onlyLive) { const el = root.querySelector(".drawer,.dialog"); if (el) el.scrollTop = scroll; }
  else { const f = root.querySelector("input:not([type=hidden]),select,textarea"); if (f && m.kind !== "drawer") f.focus(); }
}
const mHead = (title, sub = "") => `<div class="m-head"><div><h2>${esc(title)}</h2>${sub ? `<div class="muted small">${sub}</div>` : ""}</div><button class="x" data-act="close" aria-label="Close">×</button></div>`;

let rq = false;
var schedule = function schedule() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; render(); renderModals(true); }); }

  if (sel.innerHTML !== opts) sel.innerHTML = opts;

function render() {

  if (S.mode === "nodb") { main.innerHTML = `<div class="panel empty"><h2>Storage isn't available here</h2><p>Open this portal from its claude.ai link while signed in to load and save your inventory, tenants and invoices.</p></div>`; return; }
  const allLoaded = COLS.every(c => S.loaded[c]) && S.loaded.settings;
  if (!allLoaded) { main.innerHTML = `<div class="loading">Loading your spaces…</div>`; return; }
  const V = VIEWS[S.view] || VIEWS.dashboard;

/* ---------- boot ---------- */
async function boot() {
  render();
  if (!window.claude || typeof window.claude.use !== "function") { S.mode = "nodb"; render(); return; }
  const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
  if (!db) { S.mode = "nodb"; render(); return; }
  S.db = db; S.user = user; S.mode = "ready";
  if (user) {
    try { const c = await user.can("data.write"); if (c === false) S.canWrite = false; } catch {}
    try { S.userId = await user.id(); } catch {}
    try { S.isAdmin = (await user.isOwner()) || (await user.canEdit()); } catch {}
  }
  for (const c of COLS) {
    db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({ id:d.id, ...d.data() })); S.loaded[c] = true; schedule(); maybeAutoBill(); },
      e => { console.error(c, e); if (e.code === "revoked") { S.mode = "nodb"; schedule(); } });
  }
  db.doc("settings/billing").onSnapshot(s => { S.settings = { ...DEFAULT_SETTINGS, ...(s.exists ? s.data() : {}) }; S.loaded.settings = true; schedule(); maybeAutoBill(); },
    e => console.error("settings", e));
  claude.use("assets").then(a => { S.assets = a; schedule(); });
  claude.use("downloads").then(d => { S.downloads = d; });
  render();
}

/* ---------- automations: billing (incl. advance notice), monthly credits, reminders, house rules ---------- */
let autoBillTried = false;
function periodsDue() {
  const cur = monthKey(TODAY), next = shiftMonth(cur, 1);
  const out = [cur];
  if (TODAY >= addDays(monthStart(next), -(Number(S.settings.invoiceAdvanceDays) || 0))) out.push(next);
  return out;
}
async function maybeAutoBill() {
  if (autoBillTried || !S.canWrite || !S.db) return;
  if (!(COLS.every(c => S.loaded[c]) && S.loaded.settings)) return;
  autoBillTried = true;
  if (!S.tenants.length) return;
  try {
    const ref = S.db.doc("settings/billing");
    const lock = await ref.acquire({ holder: uid("tab"), ttlMs: 60000 });
    if (!lock.acquired) return;
    const msgs = [];
    if (S.settings.autoBilling) {
      for (const period of periodsDue()) {
        const fresh = await ref.get();
        if (fresh.exists && (fresh.data().billingRuns || {})[period]) continue;
        const n = await runBilling(period, true);
        if (n) msgs.push(`${n} invoice${n === 1 ? "" : "s"} for ${fmtM(period)}`);
      }
    }
    const c = await issueMonthlyCredits(monthKey(TODAY)); if (c) msgs.push(`${c} monthly credit allowance${c === 1 ? "" : "s"}`);
    if (S.settings.autoReminders !== false) { const r = await queueReminders(); if (r) msgs.push(`${r} payment reminder${r === 1 ? "" : "s"} queued`); }
    if (S.settings.autoHouseRules !== false) { const h = await queueHouseRules(); if (h) msgs.push(`${h} house rules email${h === 1 ? "" : "s"} queued`); }
    if (msgs.length) toast("Automations ran: " + msgs.join(" · ") + ".");
  } catch (e) { console.error("automations", e); }
}
async function runBilling(period, auto = false) {
  const items = pendingRent(period);
  const used = [], docs = {}, byTenant = {}, extraOps = [];
  const issue = TODAY;
  const dd = Number(S.settings.dueDays) || 0;
  const due = issue > monthStart(period) ? addDays(issue, dd) : addDays(monthStart(period), dd);
  const newDoc = (tenantId, locationId, extra) => { const id = uid("inv"); docs[id] = { number: nextInvoiceNumber(period, used), tenantId, locationId, period, issueDate: issue, dueDate: due, lines: [], status: "issued", sentAt: null, createdAt: new Date().toISOString(), createdBy: auto ? "auto" : "manual", ...extra }; return id; };
  for (const { lease, line } of items) {
    const id = newDoc(lease.tenantId, lease.locationId, { leaseId: lease.id, unitCode: lease.unitCode, kind: "rent" });
    docs[id].lines.push({ ...line, taxRate: Number(S.settings.taxRate) || 0 });
    byTenant[lease.tenantId] ||= id;
  }
  // charges waiting for the next billing cycle (unpaid bookings, additional charges)
  const pend = S.charges.filter(c => !c.invoiceId && !c.void);
  for (const c of pend) {
    let id = byTenant[c.tenantId];
    if (!id) { id = newDoc(c.tenantId, c.locationId || S.locations[0]?.id || "", { kind: "charges", unitCode: "" }); byTenant[c.tenantId] = id; }
    docs[id].lines.push({ desc: c.desc, qty: c.qty || 1, price: c.price, ...(c.noTax ? { noTax: true } : { taxRate: c.taxRate ?? (Number(S.settings.taxRate) || 0) }), chargeId: c.id });
    extraOps.push(() => patch("charges", c.id, { invoiceId: id, billedOn: issue }));
  }
  const ops = Object.entries(docs).map(([id, d]) => { const t = calcTotals(d.lines); return () => put("invoices", id, { ...d, ...t }); });
  await writeMany(ops); await writeMany(extraOps);
  const credits = period <= monthKey(TODAY) ? await issueMonthlyCredits(period) : 0;
  const runs = { ...(S.settings.billingRuns || {}), [period]: { at: new Date().toISOString(), count: Object.keys(docs).length, auto, creditWallets: credits } };
  await S.db.doc("settings/billing").set({ ...S.settings, billingRuns: runs });
  return Object.keys(docs).length;
}

/* ---------- views ---------- */
const VIEWS = {};
const head = (title, sub, actions = "") => `<div class="page-head"><div><h1>${esc(title)}</h1>${sub ? `<p>${sub}</p>` : ""}</div><div class="actions">${actions}</div></div>`;

const pill = (txt, cls = "") => `<span class="pill ${cls}">${esc(txt)}</span>`;
const W = () => S.canWrite ? "" : "disabled";

function emptyStart() {

VIEWS.dashboard = () => {
  if (!S.locations.length) return head("Dashboard", "") + emptyStart();
  const units = activeUnits();
  const occ = occupancy(TODAY, units);
  const win = S.settings.endingWindowDays || 90;
  const curLeases = S.leases.filter(l => inLoc(l) && leaseOn(l, TODAY) && unitById(l.unitId)?.status !== "archived");
  const rentRoll = curLeases.reduce((s,l) => s + (Number(l.rate)||0), 0);
  const invs = S.invoices.filter(invInLoc);
  const ag = aging(invs);
  const outstanding = ag.current + ag.d30 + ag.d60 + ag.d90 + ag.d90p;
  const overdueAmt = outstanding - ag.current;

  // attention banner
  const ph = S.tenants.filter(t => t.placeholder && tenantInLoc(t)).length;
  const est = curLeases.filter(l => l.endAssumed).length;
  const issues = S.leases.filter(l => inLoc(l) && l.dataIssue).length;
  const notes = [];
  if (ph) notes.push(`${ph} tenant profile${ph>1?"s are":" is"} placeholders from the import`);
  if (est) notes.push(`${est} lease end date${est>1?"s are":" is"} estimated (12-month terms assumed)`);

  const dummy = hasSampleData() ? `<div class="banner"><span><b>Dummy data loaded.</b> Tenant names, invoices, payments, bookings, credits, agreements and handovers marked as samples are for training. Remove them before going live.</span><button class="btn small" data-act="rmSample" ${W()}>Remove dummy data</button></div>` : "";
  const banner = dummy + (notes.length ? `<div class="banner"><span><b>Finish setup:</b> ${notes.join("; ")}.</span><span class="actions"><button class="btn small" data-act="goto" data-v="tenants" data-f="placeholder">Review tenants</button><button class="btn small" data-act="goto" data-v="leases" data-f="estimated">Review end dates</button></span></div>` : "");

  const kpi = (k, v, d, segs) => `<div class="kpi"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div>${segs ? `<div class="bar">${segs}</div>` : ""}</div>`;
  const occBar = o => `<span style="width:${pct(o.occ,o.total)}%;background:var(--occ)"></span>`;
  const seatBar = o => `<span style="width:${pct(o.seatsOcc,o.seats)}%;background:var(--occ)"></span>`;
  const kpis = `<div class="kpis kpis6">
    ${kpi("Seats occupied, all", pct(occ.all.seatsOcc, occ.all.seats) + "%", `${occ.all.seatsOcc} of ${occ.all.seats} seats`, seatBar(occ.all))}
    ${kpi("Office suite seats", occ.office.seats ? pct(occ.office.seatsOcc, occ.office.seats) + "%" : "—", `${occ.office.seatsOcc} of ${occ.office.seats} seats · ${occ.office.occ}/${occ.office.total} suites`, seatBar(occ.office))}
    ${kpi("Hot desk seats", occ.desk.seats ? pct(occ.desk.seatsOcc, occ.desk.seats) + "%" : "—", `${occ.desk.seatsOcc} of ${occ.desk.seats} seats`, seatBar(occ.desk))}
    ${kpi("Fixed desk seats", occ.fixed.seats ? pct(occ.fixed.seatsOcc, occ.fixed.seats) + "%" : "—", `${occ.fixed.seatsOcc} of ${occ.fixed.seats} seats`, seatBar(occ.fixed))}
    ${kpi("Monthly rent roll", money0(rentRoll), `${curLeases.length} active leases`)}
    ${kpi("Overdue receivables", money0(overdueAmt), `${money0(outstanding)} outstanding in total`)}
  </div>`;

  // move-outs
  const outs = units.map(u => ({ u, st: unitState(u) })).filter(x => x.st.cur && x.st.cur.end && x.st.cur.end >= TODAY && diffDays(TODAY, x.st.cur.end) <= win).sort(by(x => x.st.cur.end));
  const atRisk = outs.filter(x => !x.st.next).reduce((s,x) => s + (Number(x.st.cur.rate)||0), 0);
  const groups = {};
  outs.forEach(x => (groups[monthKey(x.st.cur.end)] ||= []).push(x));
  const outRows = Object.keys(groups).sort().map(k => `<tr><td colspan="5" style="background:var(--surface2);font-weight:600;font-size:13px">${fmtM(k)} <span class="muted">· ${groups[k].length} unit${groups[k].length>1?"s":""}</span></td></tr>` + groups[k].map(({u, st}) => `
      <tr class="click" data-act="unit" data-id="${u.id}">
        <td><b>${esc(u.code)}</b><div class="muted small">${unitMeta(u)}</div></td>
        <td>${esc(leaseWho(st.cur))}${st.cur.endAssumed ? `<div class="small" style="color:var(--end)">End date estimated</div>` : ""}</td>
        <td class="nowrap">${fmtD(st.cur.end)}<div class="muted small">${diffDays(TODAY, st.cur.end)} days</div></td>

  const outPanel = `<div class="panel"><h2>Moving out in the next ${win} days</h2><p class="sub">${outs.length ? `${outs.length} unit${outs.length>1?"s":""} ending · ${money0(atRisk)}/month at risk without a successor` : "No leases end in this window."}</p>
    ${outs.length ? `<div class="tablewrap"><table><thead><tr><th>Unit</th><th>Tenant</th><th>Lease end</th><th class="num">Rent</th><th>Next</th></tr></thead><tbody>${outRows}</tbody></table></div>` : ""}</div>`;

  // trend chart
  const months = []; for (let i = 11; i >= 0; i--) months.push(shiftMonth(monthKey(TODAY), -i));
  const pts = months.map(k => { const d = k === monthKey(TODAY) ? TODAY : monthEnd(k); const o = occupancy(d, activeUnits(d)); return { k, off: pct(o.office.seatsOcc, o.office.seats), desk: pct(o.desk.seatsOcc, o.desk.seats), fixed: pct(o.fixed.seatsOcc, o.fixed.seats), hasFixed: o.fixed.seats > 0, hasDesk: o.desk.seats > 0 }; });
  const trend = `<div class="panel"><h2>Occupancy, last 12 months</h2><p class="sub">Share of seats occupied at each month end, using the layout in place on that date</p>${lineChart(pts)}
    <div class="legend" style="margin-top:6px"><span><i style="background:var(--occ)"></i>Office suites</span><span><i style="background:var(--brass)"></i>Hot desks</span><span><i style="background:var(--hand)"></i>Fixed desks</span></div></div>`;

  // receivables
  const segs = [["current","Not yet due","var(--res)"],["d30","1–30 days","var(--end)"],["d60","31–60","var(--bad)"],["d90","61–90","var(--hand)"],["d90p","90+","var(--ink)"]];
  const debtors = S.tenants.filter(tenantInLoc).map(t => ({ t, bal: tenantBalance(t.id), od: S.invoices.filter(i => i.tenantId === t.id && invStatus(i) === "overdue").reduce((s,i) => s + invBalance(i), 0) })).filter(x => x.od > 0.005).sort(by(x => x.od, -1)).slice(0, 6);
  const recv = `<div class="panel"><h2>Receivables</h2><p class="sub">${money(outstanding)} outstanding</p>
    <div class="bar" style="height:12px">${outstanding ? segs.map(([k,,c]) => ag[k] ? `<span title="${money(ag[k])}" style="width:${ag[k]/outstanding*100}%;background:${c}"></span>` : "").join("") : ""}</div>
    <div class="legend" style="margin:8px 0 10px">${segs.map(([k,l,c]) => `<span><i style="background:${c}"></i>${l}: ${money0(ag[k])}</span>`).join("")}</div>
    ${debtors.length ? `<table><tbody>${debtors.map(x => `<tr class="click" data-act="tenant" data-id="${x.t.id}"><td>${esc(x.t.name)}</td><td class="num" style="color:var(--bad)">${money(x.od)} overdue</td></tr>`).join("")}</tbody></table>` : `<p class="muted small">No overdue invoices.</p>`}</div>`;

  // incoming
  const incoming = S.leases.filter(l => inLoc(l) && leaseValid(l) && l.start > TODAY && diffDays(TODAY, l.start) <= win).sort(by(l => l.start));
  const inc = `<div class="panel"><h2>Move-ins and handovers ahead</h2><p class="sub">Next ${win} days</p>
    ${incoming.length ? `<table><tbody>${incoming.map(l => { const u = unitById(l.unitId); const st = u ? unitState(u) : {}; return `<tr class="click" data-act="unit" data-id="${l.unitId}"><td><b>${esc(l.unitCode)}</b></td><td>${esc(leaseWho(l))}<div class="muted small">${st.cur ? `Replaces ${esc(leaseWho(st.cur))}` : "Unit vacant now"}</div></td><td class="nowrap">${fmtD(l.start)}</td></tr>`; }).join("")}</tbody></table>` : `<p class="muted small">No move-ins scheduled. Book an incoming tenant from the floor board.</p>`}</div>`;

  // vacant
  const vac = units.map(u => ({ u, st: unitState(u) })).filter(x => !x.st.cur).map(x => { const last = leasesOfUnit(x.u.id).filter(l => leaseValid(l) && l.end && l.end < TODAY).pop(); return { ...x, since: last ? last.end : null }; }).sort(by(x => x.since || "0000"));
  const potential = vac.reduce((s,x) => s + (Number(x.u.listRate)||0), 0);
  const vacP = `<div class="panel"><h2>Vacant now</h2><p class="sub">${vac.length} units · ${money0(potential)}/month at list rates</p>
    ${vac.length ? `<div class="tablewrap" style="max-height:290px;overflow:auto"><table><tbody>${vac.map(x => `<tr class="click" data-act="unit" data-id="${x.u.id}"><td><b>${esc(x.u.code)}</b> <span class="muted small">${x.u.type === "office" ? x.u.pax + " pax" : (UNIT_T[x.u.type] || "desk").toLowerCase()}</span>${x.st.next ? `<div>${pill("Reserved " + fmtD(x.st.next.start), "res")}</div>` : ""}</td><td class="muted small">${x.since ? `Empty ${diffDays(x.since, TODAY)} days` : "Never leased"}</td><td class="num">${money0(x.u.listRate)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">Fully occupied.</p>`}</div>`;

  return head("Dashboard", `${esc(locLabel())} · ${fmtD(TODAY)}`, `<button class="btn" data-act="moveIn" ${W()}>Move in tenant</button><button class="btn" data-act="bkForm" ${W()}>New booking</button><button class="btn primary" data-act="invForm" ${W()}>New invoice</button>`)
    + banner + kpis + `<div class="grid g-dash">${outPanel}${trend}</div><div class="grid g3" style="margin-top:16px">${recv}${inc}${vacP}</div>` + dashAttention() + dashBookings();
};

function lineChart(pts) {
  const Wd = 560, H = 200, L = 34, R = 10, T = 10, B = 26;
  const x = i => L + i * (Wd - L - R) / Math.max(1, pts.length - 1);
  const y = v => T + (100 - v) * (H - T - B) / 100;
  const grid = [0,25,50,75,100].map(v => `<line x1="${L}" x2="${Wd-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}%</text>`).join("");
  const line = (key, color) => `<polyline fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round" points="${pts.map((p,i) => `${x(i)},${y(p[key])}`).join(" ")}"/>` + pts.map((p,i) => `<circle cx="${x(i)}" cy="${y(p[key])}" r="3.2" fill="var(--surface)" stroke="${color}" stroke-width="2"><title>${fmtM(p.k)}: ${p[key]}%</title></circle>`).join("");
  const labels = pts.map((p,i) => `<text x="${x(i)}" y="${H-8}" text-anchor="middle">${MON[Number(p.k.slice(5))-1]}</text>`).join("");
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Occupancy trend">${grid}${labels}${line("off","var(--occ)")}${pts.some(p => p.hasDesk) ? line("desk","var(--brass)") : ""}${pts.some(p => p.hasFixed) ? line("fixed","var(--hand)") : ""}</svg>`;
}

/* ----- floor board ----- */
VIEWS.board = () => {
  if (!S.locations.length) return head("Floor board", "") + emptyStart();

  let units = S.units.filter(x => inLoc(x) && (u.showArchived || x.status !== "archived"));
  if (u.boardType !== "all") units = units.filter(x => x.type === u.boardType);
  const withSt = units.map(x => ({ u:x, st: unitState(x, d) }));
  const shown = u.boardStatus === "all" ? withSt : withSt.filter(x => x.st.status === u.boardStatus);
  const cnt = s => withSt.filter(x => x.st.status === s).length;
  const chip = (key, val, label) => `<button class="chip" data-act="ui" data-k="${key}" data-v="${val}" aria-pressed="${u[key] === val}">${label}</button>`;
  const groups = {};
  for (const x of shown) { const g = (S.loc === "all" && S.locations.length > 1 ? (locById(x.u.locationId)?.name || "?") + " · " : "") + (x.u.zone || "Units"); (groups[g] ||= []).push(x); }
  const body = Object.keys(groups).sort(by(g => (/Level/.test(g) ? "0" : "1") + g)).map(g => {

    return `<section class="zone"><div class="zone-head"><h3>${esc(g)}</h3><span class="muted small">${list.length} unit${list.length>1?"s":""}</span></div><div class="board">${list.map(tile).join("")}</div></section>`;
  }).join("");
  return head("Floor board", `${esc(locLabel())} · ${d === TODAY ? "today" : "as of " + fmtD(d)}`, `<button class="btn" data-act="importForm" ${W()}>Import from Excel</button><button class="btn primary" data-act="unitForm" ${W()}>Add unit</button>`)
    + `<div class="toolbar">
        <div class="chips">${chip("boardType","all","All")}${chip("boardType","office","Office suites")}${chip("boardType","desk","Hot desks")}${chip("boardType","fixed","Fixed desks")}</div>
        <div class="chips">${chip("boardStatus","all","Any status")}${chip("boardStatus","vacant",`Vacant (${cnt("vacant")})`)}${chip("boardStatus","ending",`Ending (${cnt("ending")})`)}${chip("boardStatus","handover",`Handover (${cnt("handover")})`)}${chip("boardStatus","reserved",`Reserved (${cnt("reserved")})`)}</div>
        <label class="small muted">View as of <input type="date" id="boardDate" data-change="boardDate" value="${d}"></label>
        ${d !== TODAY ? `<button class="btn small" data-act="ui" data-k="boardDate" data-v="${TODAY}">Today</button>` : ""}
        <label class="small"><input type="checkbox" data-change="showArchived" ${u.showArchived ? "checked" : ""}> Show archived</label>
      </div>
      <div class="legend" style="margin-bottom:16px">${Object.entries(STATUS).map(([,s]) => `<span><i style="background:${s.color}"></i>${s.label}</span>`).join("")}</div>
      ${body || `<div class="panel empty">No units match these filters.</div>`}`;
};
function tile({ u, st }) {
  const s = STATUS[st.status];
  let who = "", when = "";
  let until = "";
  if (st.cur) {
    who = esc(leaseWho(st.cur));
    until = st.cur.end ? `Lease to ${fmtD(st.cur.end)}${st.cur.endAssumed ? "*" : ""}` : "Rolling monthly";
    if (st.status === "handover") when = `Next in ${fmtD(st.next.start).replace(/ \d{4}$/, "")}`;
    else if (st.status === "ending") when = `Free from ${fmtD(addDays(st.cur.end, 1)).replace(/ \d{4}$/, "")}`;
  } else {
    who = `<span class="muted">Vacant · ${money0(u.listRate)}</span>`;
    if (st.next) when = `From ${fmtD(st.next.start).replace(/ \d{4}$/, "")}`;
  }
  return `<button class="tag ${st.status === "vacant" ? "vacant" : ""} ${u.status === "archived" ? "archived" : ""}" style="--st:${s.color}" data-act="unit" data-id="${u.id}" aria-label="Unit ${esc(u.code)}, ${s.label}">
    <span class="code">${esc(u.code)}</span><span class="meta">${unitMeta(u)}${u.status === "archived" ? " · archived" : !unitLiveOn(u, S.ui.boardDate || TODAY) ? " · not in use" : ""}</span>
    <span class="who">${who}</span>${until ? `<span class="until">${esc(until)}</span>` : ""}${when ? `<span class="when">${esc(when)}</span>` : ""}${convBadge(u)}</button>`;
}

/* ----- tenants ----- */
VIEWS.tenants = () => {
  const u = S.ui; const q = u.tenantQ.trim().toLowerCase(); const seg = u.tenantSeg || "tenants";
  const all = S.tenants.filter(tenantInLoc).map(t => ({ t, st: tenantStatus(t), bal: tenantBalance(t.id), units: tenantLeases(t.id).filter(l => leaseOn(l, TODAY)).map(l => l.unitCode) }));

  const nT = all.filter(x => !isMember(x)).length, nM = all.filter(isMember).length;
  let list = seg === "members" ? all.filter(isMember) : seg === "tenants" ? all.filter(x => !isMember(x)) : all;

    if (u.tenantKind !== "all") list = list.filter(x => x.t.kind === u.tenantKind);

  return head("Tenants & members", `${nT} tenant${nT === 1 ? "" : "s"} · ${nM} app member${nM === 1 ? "" : "s"}`, `<button class="btn" data-act="exportTenants">Export CSV</button><button class="btn" data-act="compose" ${W()}>Email</button><button class="btn" data-act="moveIn" ${W()}>Move in tenant</button><button class="btn" data-act="tenantForm" data-member="1" ${W()}>Add app member</button><button class="btn primary" data-act="tenantForm" ${W()}>Add tenant</button>`)
    + `<div class="toolbar"><div class="seg">${segB("tenants", `Tenants (${nT})`)}${segB("members", `App members (${nM})`)}${segB("all", "Everyone")}</div><input type="search" id="tenantQ" data-input="tenantQ" placeholder="Search name, email, unit" value="${esc(u.tenantQ)}"></div>
      ${seg === "members" ? `<div class="banner"><span>App members are people and companies outside your tenancy who signed up to book meeting rooms or the event space. They're billed per booking or with credits packages, and become tenants automatically if they move into a unit.</span></div>` : `<div class="toolbar"><div class="chips">${chip("tenantStatus","current","Current")}${chip("tenantStatus","incoming","Incoming")}${chip("tenantStatus","past","Past")}${chip("tenantStatus","prospect","Prospects")}${chip("tenantStatus","placeholder","Needs details")}${chip("tenantStatus","all","All")}</div>

/* ----- leases ----- */
VIEWS.leases = () => {
  const f = S.ui.leaseFilter, win = S.settings.endingWindowDays || 90;
  const all = S.leases.filter(inLoc);
  const tests = {
    active: l => leaseOn(l, TODAY), upcoming: l => leaseValid(l) && l.start > TODAY,
    ending: l => leaseOn(l, TODAY) && l.end && diffDays(TODAY, l.end) <= win, rolling: l => leaseOn(l, TODAY) && !l.end,
    estimated: l => leaseOn(l, TODAY) && l.endAssumed, ended: l => leaseValid(l) && l.end && l.end < TODAY, issues: l => !!l.dataIssue, all: () => true
  };
  const labels = { active:"Active", upcoming:"Upcoming", ending:`Ending ≤ ${win}d`, rolling:"Rolling monthly", estimated:"Estimated end", ended:"Ended", issues:"Data issues", all:"All" };
  const list = all.filter(tests[f] || tests.active).sort(f === "ended" ? by(l => l.end, -1) : f === "all" ? by(l => l.unitCode) : by(l => l.end || "9999"));
  return head("Leases", `${list.length} shown · ${esc(locLabel())}`, `<button class="btn primary" data-act="moveIn" ${W()}>Move in tenant</button>`)
    + `<div class="toolbar"><div class="chips">${Object.keys(labels).map(k => `<button class="chip" data-act="ui" data-k="leaseFilter" data-v="${k}" aria-pressed="${f === k}">${labels[k]} (${all.filter(tests[k]).length})</button>`).join("")}</div></div>
    ${f === "estimated" ? `<div class="banner"><span>These end dates were estimated at import as 12-month terms from the move-in date. Open each lease and confirm or correct the contract end date.</span></div>` : ""}
    <div class="panel" style="padding:6px 10px"><div class="tablewrap"><table><thead><tr><th>Unit</th><th>Tenant</th><th>Move-in</th><th>Lease end</th><th class="num">Rent</th><th class="num">Deposit</th><th>Status</th></tr></thead><tbody>
    ${list.map(l => { const on = leaseOn(l, TODAY); const days = l.end ? diffDays(TODAY, l.end) : null;
      const st = l.dataIssue ? pill("Check data","bad") : on ? (l.end && days <= win ? pill(`${days}d left`,"end") : pill("Active","occ")) : l.start > TODAY ? pill("Upcoming","res") : pill("Ended");
      return `<tr class="click" data-act="leaseForm" data-id="${l.id}"><td><b>${esc(l.unitCode)}</b></td><td>${esc(leaseWho(l))}</td><td class="nowrap">${fmtD(l.start)}</td><td class="nowrap">${l.end ? fmtD(l.end) : `<span class="muted">Rolling</span>`}${l.endAssumed ? ` <span style="color:var(--end)" title="Estimated">*</span>` : ""}</td><td class="num">${money(l.rate)}</td><td class="num">${l.deposit ? money(l.deposit) : "—"}</td><td>${st}</td></tr>`; }).join("") || `<tr><td colspan="7" class="empty">No leases in this view.</td></tr>`}
    </tbody></table></div></div>`;
};

const INV_KIND = { rent:"Rent", adhoc:"Additional", booking:"Room booking", package:"Credits package", creditnote:"Credit note", latefee:"Late fee", upfront:"Deposit & first month", charges:"Additional charges" };
VIEWS.invoices = () => {
  const u = S.ui; const q = u.invQ.trim().toLowerCase();

  const months = [...new Set(base.map(i => i.period).filter(Boolean))].sort().reverse();
  let list = base.filter(i => u.invMonth === "all" || i.period === u.invMonth);
  const counts = {}; list.forEach(i => { const s = invStatus(i); counts[s] = (counts[s]||0) + 1; });
  if (u.invStatus === "unpaid") list = list.filter(i => ["open","partial","overdue"].includes(invStatus(i)));
  else if (u.invStatus !== "all") list = list.filter(i => invStatus(i) === u.invStatus);
  if (q) list = list.filter(i => [i.number, tenantName(i.tenantId), i.unitCode, ...(i.lines||[]).map(l => l.desc)].join(" ").toLowerCase().includes(q));
  list.sort(by(i => i.issueDate + i.number, -1));

  return head("Invoices", `${list.length} invoices · ${money(billed)} billed · ${money(due)} unpaid`, `<button class="btn" data-act="invExport">Export</button><button class="btn" data-act="billingRun" ${W()}>Run monthly billing</button><button class="btn primary" data-act="invForm" ${W()}>New invoice</button>`)
    + `<div class="banner"><span>${S.settings.autoBilling ? `Automatic billing is on: next month's invoices are issued ${S.settings.invoiceAdvanceDays} days before the 1st (from ${fmtD(addDays(monthStart(shiftMonth(monthKey(TODAY),1)), -(Number(S.settings.invoiceAdvanceDays)||0)))}), and include any charges waiting for the next cycle and late fees.` : `Automatic billing is off. Run monthly billing manually or turn it on in Settings.`}${S.charges.filter(c => !c.invoiceId && !c.void).length ? ` ${S.charges.filter(c => !c.invoiceId && !c.void).length} charges are waiting for the next monthly invoices.` : ""} ${run ? `${fmtM(period)} billed ${fmtD(run.at.slice(0,10))} (${run.count} invoices).` : `${fmtM(period)} hasn't been billed yet.`}</span></div>

    ${list.slice(0, 400).map(i => { const s = INV_ST[invStatus(i)]; return `<tr class="click" data-act="invoice" data-id="${i.id}"><td><b>${esc(i.number)}</b><div class="muted small">${INV_KIND[i.kind] || "Additional"}${i.sentAt ? " · sent" : ""}</div></td><td>${esc(tenantName(i.tenantId))}</td><td class="small">${esc(i.lines?.[0]?.desc || "")}${i.lines?.length > 1 ? ` <span class="muted">+${i.lines.length-1} more</span>` : ""}</td><td class="nowrap">${fmtD(i.issueDate)}</td><td class="nowrap">${fmtD(i.dueDate)}</td><td class="num">${money(i.total)}</td><td class="num">${money(invBalance(i))}${(f => f ? `<div class="small" style="color:var(--bad)" title="Late fee incl. GST${f.settled ? ", to bill" : ", accruing daily"}">+ ${money(f.total)} late fee</div>` : "")(lateFeeDue(i))}</td><td>${pill(s[0], s[1])}</td></tr>`; }).join("") || `<tr><td colspan="8" class="empty">No invoices here yet.</td></tr>`}

  const opts = [-2,-1,0,1].map(n => shiftMonth(monthKey(TODAY), n)).map(m => `<option value="${m}" ${m === period ? "selected" : ""}>${fmtM(m)}${(S.settings.billingRuns || {})[m] ? " (billed)" : ""}</option>`).join("");

    <div class="actions section"><button class="btn primary" data-act="doRun" data-v="${period}" ${can ? "" : "disabled"} ${W()}>Issue invoices</button><button class="btn" data-act="close">Close</button></div>`;

function invoiceDoc(inv) {
  const t = tenantById(inv.tenantId) || { name: inv.previewName || "" }; const loc = locById(inv.locationId) || {};
  const paid = inv.preview ? 0 : allocatedTo(inv.id);

function statementData(tid, from, to) {
  const ev = [];
  for (const i of S.invoices) if (i.tenantId === tid && i.status !== "void") ev.push({ date: i.issueDate, type:"Invoice", ref: i.number, desc: (i.lines||[]).map(l => l.desc).join("; "), debit: i.total, credit: 0, id: i.id, act:"invoice" });
  for (const p of S.payments) if (p.tenantId === tid) ev.push({ date: p.date, type:"Payment", ref: p.reference || p.method || "", desc: (p.allocations||[]).map(a => S.invoices.find(i => i.id === a.invoiceId)?.number).filter(Boolean).join(", "), debit: 0, credit: p.amount, id: p.id, act:"payment" });
  ev.sort(by(e => e.date + (e.type === "Invoice" ? "0" : "1")));
  let opening = 0; const rows = [];
  for (const e of ev) { if (from && e.date < from) { opening += e.debit - e.credit; continue; } if (to && e.date > to) continue; rows.push(e); }
  let bal = opening; rows.forEach(e => { bal = r2(bal + e.debit - e.credit); e.bal = bal; });
  return { opening: r2(opening), rows, closing: r2(bal) };
}

function importPlan(rows) {
  const m = IM.map, loc = IM.loc; const ex = new Set(S.units.filter(u => u.locationId === loc).map(u => u.code));
  const newUnits = new Map(); let existing = 0, skipped = 0; const leases = [];
  const seenExisting = new Set();
  for (const r of rows) {
    const code = String(r[m.code] ?? "").trim(); if (!code) { skipped++; continue; }
    const type = /fixed/i.test(String(r[m.type] ?? "")) ? "fixed" : /desk/i.test(String(r[m.type] ?? "")) ? "desk" : "office"; const pax = Math.max(1, Number(r[m.pax]) || 1); const rate = m.rate !== "" ? r2(num(r[m.rate])) : 0;
    if (ex.has(code)) { if (!seenExisting.has(code)) { existing++; seenExisting.add(code); } }
    else if (!newUnits.has(code)) newUnits.set(code, { code, type, pax, listRate: rate, zone: zoneOf(code) });
    else if (rate) newUnits.get(code).listRate = rate;
    if (IM.mode === "history") {
      const start = toISODate(r[m.start], true); if (!start) { skipped++; continue; }
      const end = m.end !== "" ? toISODate(r[m.end], true) : null;
      leases.push({ code, start, end, rate });
    }
  }
  return { newUnits: [...newUnits.values()], existing, skipped, leases };
}

    ${[...(s.packages || []), {credits:"",price:"",months:""}].map(p => `<tr><td><input type="number" min="0" name="pk_c" value="${p.credits}" style="width:110px"></td><td><input type="number" step="0.01" min="0" name="pk_p" value="${p.price}" style="width:130px"></td><td><input type="number" min="1" name="pk_m" value="${p.months}" style="width:90px"></td></tr>`).join("")}</tbody></table><p class="hint">Fill the empty row to add a package; clear the credits to remove one.</p></div>

};

/* ======================================================================
   ROOM BOOKINGS & CREDITS
   Rules mirror the BizPlus Credits app: hourly rooms, event space with
   cleaning fee + refundable deposit + 2 hr minimum, aircon extension
   outside standard hours, GST on the cash portion only, credits drawn
   earliest-expiring first (contract credits last), 12-hour cancellation
   cutoff, cash refunds issued as 1-month Refund Credits.
   ====================================================================== */
const RES_KIND = { meeting: "Meeting room", event: "Event space" };
const WALLET_T = { monthly: "Monthly credits", contract: "Lump sum credits", topup: "Top-up package", refund: "Refund credits", bonus: "Bonus credits" };
const cr = n => { const v = r2(n); return (Number.isInteger(v) ? v.toLocaleString() : v.toLocaleString(undefined, { maximumFractionDigits: 2 })) + " cr"; };
const hLabel = h => { if (h >= 24) return "12am⁺"; const hh = Math.floor(h), mm = Math.round((h - hh) * 60); const ap = hh >= 12 ? "pm" : "am"; return `${((hh + 11) % 12) + 1}${mm ? ":" + pad(mm) : ""}${ap}`; };
const bkTime = b => `${hLabel(b.start)}–${hLabel(b.end)}`;
const dowOf = d => parseD(d).getDay();
const resById = id => S.resources.find(r => r.id === id);
const activeResources = () => S.resources.filter(r => r.active !== false && (S.loc === "all" || r.locationId === S.loc)).sort(by(r => (r.kind === "event" ? "1" : "0") + (r.floor || "") + r.name));

function isSurcharged(date, h) {
  const st = S.settings, w = dowOf(date);
  if (w === 0) return true;
  if (w === 6) return !(h >= st.satStart && h < st.satEnd);
  return !(h >= st.wkStart && h < st.wkEnd);
}
function airconHours(date, start, end) { let q = 0; for (let i = Math.round(start * 4); i < Math.round(end * 4); i++) if (isSurcharged(date, Math.floor(i / 4))) q++; return q / 4; }
function priceBooking(res, date, start, end, extendFrom = null) {
  const from = extendFrom ?? start, dur = r2(end - from);
  const rent = r2(dur * (Number(res.hourlyRate) || 0));
  const ach = airconHours(date, from, end), aircon = r2(ach * (Number(S.settings.airconRate) || 0));
  let cleaning = 0, deposit = 0;
  if (res.kind === "event" && extendFrom == null) { const w = dowOf(date); cleaning = Number(w === 0 || w === 6 ? res.cleaningFeeWeekend : res.cleaningFeeWeekday) || 0; deposit = Number(res.deposit) || 0; }
  return { dur, rent, airconHours: ach, aircon, cleaning, deposit, subtotal: r2(rent + aircon + cleaning) };
}

/* credits wallets */
const walletLive = (w, d = TODAY) => (Number(w.remaining) || 0) > 0.005 && (!w.expiresOn || w.expiresOn >= d);
const walletSortKey = w => w.type === "contract" ? "9999-12-31~" : (w.expiresOn || "9999-12-31");
const walletsOf = (tid, d = TODAY) => S.wallets.filter(w => w.tenantId === tid && walletLive(w, d)).sort(by(walletSortKey));
const creditBalance = tid => r2(walletsOf(tid).reduce((s, w) => s + Number(w.remaining), 0));
function planDraw(tid, amount) {
  let left = r2(amount); const out = [];
  for (const w of walletsOf(tid)) { if (left <= 0.005) break; const a = r2(Math.min(left, w.remaining)); out.push({ walletId: w.id, amount: a }); left = r2(left - a); }
  return out;
}
async function applyDraw(tid, draw, meta) {
  for (const d of draw) {
    const w = S.wallets.find(x => x.id === d.walletId);
    await patch("wallets", d.walletId, { remaining: r2(Number(w.remaining) - d.amount) });
    w.remaining = r2(Number(w.remaining) - d.amount);
    await put("creditTxns", uid("ct"), { tenantId: tid, walletId: d.walletId, walletType: w.type, delta: -d.amount, kind: "booking", date: TODAY, at: new Date().toISOString(), ...meta });
  }
}
async function addWallet(tid, w, txnMeta = {}) {
  const id = uid("w");
  await put("wallets", id, { tenantId: tid, remaining: w.total, createdAt: new Date().toISOString(), ...w });
  await put("creditTxns", uid("ct"), { tenantId: tid, walletId: id, walletType: w.type, delta: w.total, kind: txnMeta.kind || "grant", date: TODAY, at: new Date().toISOString(), note: w.name, ...txnMeta, ...(w.sample ? { sample: true } : {}) });
  await settle(() => S.wallets.some(x => x.id === id));
  return id;
}
/* monthly allowance from the rental package, with carry-forward cap */
/* sources of monthly credits: a lease's rental package, or a monthly credit plan granted by the manager */
function monthlyDue(period) {
  const out = [];
  for (const l of S.leases) {
    if (!l.tenantId || !(Number(l.monthlyCredits) > 0) || !leaseValid(l)) continue;
    if (!(l.start <= monthEnd(period) && (!l.end || l.end >= monthStart(period)))) continue;
    if (S.wallets.some(w => w.type === "monthly" && w.leaseId === l.id && w.period === period)) continue;
    out.push({ id: l.id, key: "leaseId", tenantId: l.tenantId, credits: Number(l.monthlyCredits), carryCap: Number(l.carryCap) || 0, label: `unit ${l.unitCode}` });
  }
  for (const p of S.creditPlans) {
    if (p.active === false || !(Number(p.credits) > 0) || p.startMonth > period || (p.endMonth && p.endMonth < period)) continue;
    if (S.wallets.some(w => w.type === "monthly" && w.planId === p.id && w.period === period)) continue;
    out.push({ id: p.id, key: "planId", tenantId: p.tenantId, credits: Number(p.credits), carryCap: p.carryForward ? Number(p.carryCap) || 0 : 0, label: p.note || "monthly plan" });
  }
  return out;
}
async function issueMonthlyCredits(period, only = null) {
  const due = monthlyDue(period).filter(l => !only || l.id === only);
  for (const l of due) {
    const prev = S.wallets.find(w => w.type === "monthly" && w[l.key] === l.id && w.period === shiftMonth(period, -1) && !w.carriedOut);
    let carry = 0;
    if (prev) {
      carry = r2(Math.min(Number(prev.remaining) || 0, l.carryCap));
      const lapsed = r2((Number(prev.remaining) || 0) - carry);
      await patch("wallets", prev.id, { remaining: 0, carriedOut: true });
      if (carry > 0) await put("creditTxns", uid("ct"), { tenantId: l.tenantId, walletId: prev.id, walletType: "monthly", delta: -carry, kind: "carry", date: TODAY, at: new Date().toISOString(), note: `Carried into ${fmtM(period)}` });
      if (lapsed > 0) await put("creditTxns", uid("ct"), { tenantId: l.tenantId, walletId: prev.id, walletType: "monthly", delta: -lapsed, kind: "expiry", date: TODAY, at: new Date().toISOString(), note: "Unused allowance above the carry-forward cap" });
    }
    await addWallet(l.tenantId, { type: "monthly", name: `${fmtM(period)} credits · ${l.label}`, total: r2(l.credits + carry), allowance: l.credits, carriedIn: carry, period, [l.key]: l.id, expiresOn: monthEnd(period) }, { kind: "monthly", note: `${fmtM(period)} allowance${carry ? ` incl. ${carry} carried forward` : ""}` });
  }
  return due.length;
}

/* bookings */
const bkStart = b => { const d = parseD(b.date); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, Math.round(b.start * 60)); };
const bkEnd = b => { const d = parseD(b.date); return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, Math.round(b.end * 60)); };
function bkState(b) { if (b.status === "cancelled") return "cancelled"; const n = new Date(); return n < bkStart(b) ? "upcoming" : n < bkEnd(b) ? "ongoing" : "completed"; }
const BK_ST = { upcoming: ["Upcoming", "res"], ongoing: ["In progress", "occ"], completed: ["Completed", ""], cancelled: ["Cancelled", "bad"] };
const bkConflict = (resourceId, date, start, end, exceptId) => S.bookings.find(b => b.resourceId === resourceId && b.date === date && b.status !== "cancelled" && b.id !== exceptId && b.start < end && b.end > start);
const bkInLoc = b => S.loc === "all" || b.locationId === S.loc;
const bkWho = b => tenantName(b.tenantId) || b.guestName || "Guest";
function bkPayKind(b) {
  if ((b.chargeIds || []).some(id => { const c = S.charges.find(x => x.id === id); return c && !c.void && !c.invoiceId; })) return "nextcycle";
  const inv = b.invoiceId ? S.invoices.find(i => i.id === b.invoiceId) : (b.chargeIds || []).map(id => S.charges.find(x => x.id === id)?.invoiceId).filter(Boolean).map(id => S.invoices.find(i => i.id === id))[0];
  if (inv && inv.status !== "void" && invBalance(inv) > 0.005) return "unpaid";
  if ((b.creditsUsed || 0) > 0 && (b.cashDue || 0) > 0) return "mixed";
  if ((b.creditsUsed || 0) > 0) return "credits";
  if ((b.cashDue || 0) > 0) return "cash";
  return "free";
}
const PAY_K = { credits: ["Credits", "var(--occ)", "occ"], cash: ["Card / transfer", "var(--res)", "res"], nextcycle: ["Next monthly invoice", "var(--brass)", "brass"], mixed: ["Credits + cash", "var(--hand)", "hand"], unpaid: ["Unpaid", "var(--end)", "end"], free: ["No charge", "var(--vac)", ""] };
const bkInvoiceIds = b => [b.invoiceId, ...(b.extensions || []).map(e => e.invoiceId)].filter(Boolean);
const bkDraws = b => [...(b.creditsFrom || []), ...(b.extensions || []).flatMap(e => e.creditsFrom || [])];
function cashPaidFor(b) {
  const direct = bkInvoiceIds(b).reduce((s, id) => { const inv = S.invoices.find(i => i.id === id); return s + (inv && inv.status !== "void" ? Math.min(allocatedTo(inv.id), inv.total) : 0); }, 0);
  const viaCycle = (b.chargeIds || []).map(id => S.charges.find(x => x.id === id)).filter(c => c && c.invoiceId && !c.void).reduce((s, c) => { const inv = S.invoices.find(i => i.id === c.invoiceId); return s + (inv && invStatus(inv) === "paid" ? chargeTotal(c) : 0); }, 0);
  return r2(direct + viaCycle);
}
function refundPreview(b, mode = "policy") {
  const hrs = (bkStart(b) - new Date()) / 36e5;
  const eligible = mode === "full" ? true : mode === "none" ? false : hrs >= S.settings.cancelCutoffHours;
  const credits = r2(bkDraws(b).reduce((s, d) => s + d.amount, 0)), cash = r2(cashPaidFor(b));
  if (!eligible) return { eligible, hrs, credits: 0, cash: 0, dest: "none" };
  return { eligible, hrs, credits, cash, dest: cash > 0.005 ? "refund" : (credits > 0 ? "source" : "none") };
}
function standardHoursIn(period) {
  const st = S.settings; let h = 0;
  for (let d = monthStart(period); d <= monthEnd(period); d = addDays(d, 1)) { const w = dowOf(d); h += w === 0 ? 0 : w === 6 ? st.satEnd - st.satStart : st.wkEnd - st.wkStart; }
  return h;
}

/* create a booking: draws credits, invoices the cash portion (GST on cash only), records payment */
async function createBooking(p) {
  const res = resById(p.resourceId);
  const price = priceBooking(res, p.date, p.start, p.end);
  const bal = p.tenantId ? creditBalance(p.tenantId) : 0;
  const want = p.credits != null ? Number(p.credits) : (p.useCredits ? Infinity : 0);
  const credits = p.tenantId ? r2(Math.max(0, Math.min(bal, price.subtotal, want))) : 0;
  const draw = credits ? planDraw(p.tenantId, credits) : [];
  const cashBase = r2(price.subtotal - credits);
  const gstRate = Number(S.settings.bookingTaxRate) || 0;
  const id = uid("bk"); const sample = p.sample ? { sample: true } : {};
  let invoiceId = null, cashDue = 0;
  if (draw.length) await applyDraw(p.tenantId, draw, { bookingId: id, note: `${res.name} · ${fmtD(p.date)}`, ...sample });
  let chargeIds = [];
  if (p.method === "nextcycle") {
    const lines = bookingLines(res, p.date, p.start, p.end, price, credits, draw).map(l => ({ ...l, taxRate: gstRate }));
    cashDue = calcTotals(lines, gstRate).total;
    if (cashDue > 0.005) chargeIds = await addCharges(p.tenantId, lines, { source: "booking", bookingId: id, ...sample });
  } else {
    const lines = bookingLines(res, p.date, p.start, p.end, price, credits, draw);
    const t = calcTotals(lines, gstRate); cashDue = t.total;
    invoiceId = uid("inv");
    await put("invoices", invoiceId, { number: nextInvoiceNumber(monthKey(TODAY), []), tenantId: p.tenantId, locationId: res.locationId, leaseId: null, unitCode: "", kind: "booking", bookingId: id, period: monthKey(TODAY), issueDate: TODAY, dueDate: p.method === "account" && t.total > 0 ? addDays(TODAY, Number(S.settings.dueDays) || 0) : TODAY, lines, ...t, taxRate: gstRate, payMethod: t.total > 0 ? p.method : "credits", deposit: price.deposit || 0, status: "issued", sentAt: null, createdAt: new Date().toISOString(), createdBy: "booking", ...sample });
    if (p.method !== "account" && t.total > 0.005) await put("payments", uid("pay"), { tenantId: p.tenantId, date: TODAY, amount: t.total, method: methodName(p.method), reference: `Booking ${res.name} ${p.date}`, allocations: [{ invoiceId, amount: t.total }], source: "booking", createdAt: new Date().toISOString(), ...sample });
  }
  await put("bookings", id, { resourceId: res.id, resourceName: res.name, kind: res.kind, locationId: res.locationId, tenantId: p.tenantId, date: p.date, start: p.start, end: p.end, price, creditsUsed: credits, creditsFrom: draw, cashBase, gst: r2(cashDue - cashBase), cashDue, invoiceId, chargeIds, method: p.method, deposit: price.deposit, depositStatus: price.deposit ? (p.depositCollected ? "held" : "pending") : "none", status: "confirmed", source: p.source || "admin", notes: p.notes || "", extensions: [], createdAt: new Date().toISOString(), ...sample });
  await settle(() => S.bookings.some(b => b.id === id) && (!invoiceId || S.invoices.some(i => i.id === invoiceId)));
  return id;
}

/* ---------- views ---------- */
VIEWS.bookings = () => {
  const u = S.ui; const rs = activeResources().filter(r => u.bkKind === "all" || r.kind === u.bkKind);
  const seg = (k, v, l) => `<button type="button" data-act="ui" data-k="${k}" data-v="${v}" aria-pressed="${u[k] === v}">${l}</button>`;
  const chip = (k, v, l) => `<button class="chip" data-act="ui" data-k="${k}" data-v="${v}" aria-pressed="${u[k] === v}">${l}</button>`;
  const hasSample = hasSampleData();
  const actions = `${hasSample ? `<button class="btn" data-act="rmSample" ${W()}>Remove sample data</button>` : ""}<button class="btn" data-act="pkgForm" ${W()}>Sell credits package</button><button class="btn primary" data-act="bkForm" ${W()}>New booking</button>`;

function bkRead(f) {
